<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propeller-Guided Max-Cut — Théorème d'équilibre Ramanujan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --text-main: #ffffff;
    --text-muted: #b0b0c0;
    --panel-bg: rgba(10, 10, 15, 0.92);
    --panel-border: rgba(150, 150, 255, 0.3);
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --accent-gold: #eab308;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --font-title: clamp(2rem, 3.8vw, 3.2rem);
    --font-eq: clamp(1.15rem, 2vw, 1.75rem);
    --font-desc: clamp(1rem, 1.4vw, 1.25rem);
    --font-legend: 1.05rem;
    --panel-width: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Times New Roman", Times, serif;
    background-color: var(--bg);
    color: var(--text-main);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #stage.panel-open { padding-left: var(--panel-width); }
  #stage.panel-open #description-wrap { left: var(--panel-width); right: 0; }
  #stage.panel-open .floating-legend.left {
    left: calc(var(--panel-width) + 12px); right: auto;
    top: 50%; transform: translateY(-50%);
  }
  #stage.panel-open .floating-legend.right {
    right: 12px; left: auto;
    top: 50%; transform: translateY(-50%);
  }
  #particles-canvas {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }
  #stage.panel-open #particles-canvas { left: var(--panel-width); }

  #stage-header {
    position: relative; z-index: 20;
    padding: 12px 36px 14px;
    text-align: center;
    flex: 0 0 auto;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 70%, transparent 100%);
    min-height: 0;
  }
  #scene-title {
    font-size: var(--font-title);
    font-weight: 400;
    margin: 0 0 6px 0;
    letter-spacing: 1.4px;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 2px 12px rgba(0,0,0,0.9);
    pointer-events: auto;
    line-height: 1.2;
  }
  #scene-eq {
    margin: 0 auto 0;
    padding-top: 4px;
    font-size: var(--font-eq);
    color: #ffffff;
    display: block;
    min-height: 1.5em;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 2px 10px rgba(0,0,0,0.85);
    pointer-events: auto;
    line-height: 1.4;
    max-width: min(960px, 94%);
  }
  #scene-caption {
    display: block;
    margin: 8px auto 0;
    font-size: clamp(0.9rem, 1.3vw, 1.08rem);
    color: #eab308;
    font-style: italic;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    pointer-events: none;
    min-height: 1.2em;
    max-width: 90%;
  }

  #canvas-wrap {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    margin: 0; min-height: 0;
    display: flex; justify-content: center; align-items: center;
    padding-top: 4px;
    padding-bottom: 110px;
  }
  #canvas-wrap canvas {
    width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none;
  }
  #canvas-wrap canvas:active { cursor: grabbing; }

  .floating-legend {
    position: absolute; z-index: 15;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: var(--font-legend);
    line-height: 1.5;
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.85);
    pointer-events: auto;
    max-width: 250px;
    cursor: grab;
    user-select: none;
    top: 50%;
    transform: translateY(-50%);
    transition: box-shadow 0.2s ease, left 0.3s cubic-bezier(0.4, 0, 0.2, 1), right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .floating-legend:active { cursor: grabbing; box-shadow: 0 16px 56px rgba(168,85,247,0.4); }
  .floating-legend.left { left: 12px; right: auto; }
  .floating-legend.right { right: 12px; left: auto; }
  .floating-legend h4 {
    margin: 0 0 10px;
    font-family: "Consolas", monospace;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-purple);
    border-bottom: 2px solid rgba(168, 85, 247, 0.5);
    padding-bottom: 6px;
    cursor: grab;
  }
  .floating-legend ul { list-style: none; margin: 0; padding: 0; }
  .floating-legend li {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px;
  }
  .floating-legend .swatch {
    flex: 0 0 auto; width: 14px; height: 14px;
    border-radius: 4px; margin-top: 3px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .floating-legend .eq {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-style: italic;
    color: #ffffff;
    font-size: 1.05rem;
    text-align: center;
  }

  #description-wrap {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    z-index: 12;
    display: flex; justify-content: center; align-items: center;
    pointer-events: none;
    padding: 0 28px;
  }
  #description {
    background: rgba(5, 5, 10, 0.97);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 24px;
    font-size: var(--font-desc);
    line-height: 1.5;
    color: #f0f0f5;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.95);
    pointer-events: auto;
    transition: all 0.3s ease;
    max-width: min(860px, 90%);
    margin: 0 auto;
  }
  #stage.panel-open #description { max-width: min(1080px, 94%); }
  #description strong { color: #ffffff; font-weight: 700; }
  #description em { color: var(--accent-cyan); font-style: italic; }

  #toolbar {
    position: absolute; top: 12px; left: 12px;
    display: flex; gap: 10px; z-index: 40;
  }
  #toolbar button {
    font-family: inherit; font-size: 0.95rem;
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(10, 10, 18, 0.9);
    color: var(--text-main); cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  #toolbar button:hover { background: rgba(40, 40, 65, 0.98); border-color: var(--accent-purple); }
  #toolbar button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #panel {
    position: fixed; top: 0; left: 0;
    width: var(--panel-width); height: 100vh;
    background: rgba(8, 8, 14, 0.99);
    border-right: 1px solid var(--panel-border);
    overflow-y: auto; padding: 22px;
    z-index: 60; transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(24px);
    box-shadow: 12px 0 60px rgba(0,0,0,0.6);
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 1.4rem; margin: 0 0 18px; color: var(--accent-purple); font-weight: 400; }

  .scene-list { list-style: none; padding: 0; margin: 0 0 18px; }
  .scene-list li {
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 0.95rem; margin-bottom: 7px;
    border: 1px solid transparent; transition: all 0.2s;
    background: rgba(255,255,255,0.03);
  }
  .scene-list li:hover { background: rgba(255,255,255,0.09); }
  .scene-list li.active { background: rgba(168, 85, 247, 0.18); border-color: var(--accent-purple); }
  .scene-list li .tag {
    display: inline-block; font-family: "Consolas", monospace;
    font-size: 0.72rem; background: #333; padding: 3px 8px;
    border-radius: 5px; margin-right: 10px; color: #fff;
  }
  .scene-list li .tag.np  { background: #f43f5e; }
  .scene-list li .tag.geo { background: #a855f7; }
  .scene-list li .tag.flow{ background: #06b6d4; }
  .scene-list li .tag.cmp { background: #eab308; }
  .scene-list li .tag.opt { background: #22c55e; }
  .scene-list li .tag.syn { background: #8b5cf6; }
  .scene-list li .tag.ram { background: #0891b2; }

  .params { margin-bottom: 18px; }
  .params h3 {
    font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px; border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 7px;
  }
  .param { margin-bottom: 14px; font-size: 0.95rem; }
  .param label { display: flex; justify-content: space-between; margin-bottom: 7px; }
  .param input[type=range] { width: 100%; accent-color: var(--accent-purple); height: 6px; }

  .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .toggle-row button {
    font-family: inherit; font-size: 0.88rem;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06); color: var(--text-main);
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-row button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #timeline-panel {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  #timeline-panel h3 {
    font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px;
  }
  #timeline-panel .timeline-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  #timeline-panel input[type=range] { flex: 1; accent-color: var(--accent-purple); height: 6px; }
  #timeline-panel .step-label {
    font-size: 0.8rem; color: var(--accent-gold);
    font-family: "Consolas", monospace; white-space: nowrap;
  }
  #btn-cinema {
    width: 100%; padding: 11px;
    background: var(--accent-gold); color: #000;
    border: none; border-radius: 10px;
    font-family: inherit; font-size: 1rem;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  #btn-cinema:hover { background: #fbbf24; }
  #btn-cinema.playing { background: var(--accent-red); color: #fff; }
</style>
</head>
<body>

<main id="stage">
  <canvas id="particles-canvas"></canvas>

  <div id="toolbar">
    <button id="btn-panel">☰ Scènes & Paramètres</button>
    <button id="btn-full">⛶ Plein écran</button>
  </div>

  <header id="stage-header">
    <h1 id="scene-title">Propeller-Guided Max-Cut</h1>
    <div id="scene-eq"></div>
    <div id="scene-caption"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="view"></canvas>
  </div>

  <div id="legend-left" class="floating-legend left"></div>
  <div id="legend-right" class="floating-legend right"></div>

  <div id="description-wrap">
    <div id="description"></div>
  </div>
</main>

<aside id="panel">
  <h2>Propeller-Guided Max-Cut</h2>
  <ul class="scene-list" id="scene-list"></ul>

  <div class="params">
    <h3>Paramètres de la figure</h3>
    <div id="param-box"></div>
  </div>

  <div class="params">
    <h3>Rendu</h3>
    <div class="param">
      <label><span>Vitesse</span><span id="speed-val">0.55</span></label>
      <input type="range" id="speed" min="0" max="2" step="0.01" value="0.55">
    </div>
    <div class="param">
      <label><span>Opacité du fond</span><span id="bg-val">1.0</span></label>
      <input type="range" id="bg-opacity" min="0.1" max="1" step="0.05" value="1">
    </div>
    <div class="toggle-row">
      <button id="btn-auto" class="on">↻ Auto</button>
      <button id="btn-pause">⏸ Pause</button>
      <button id="btn-grid"># Grille</button>
      <button id="btn-labels" class="on">🏷 Labels</button>
      <button id="btn-particles" class="on">✦ Particules</button>
    </div>
  </div>

  <div id="timeline-panel">
    <h3>⏱ Timeline & Cinéma</h3>
    <div class="timeline-row">
      <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1">
      <span id="step-label" class="step-label">Étape 0 / 0</span>
    </div>
    <button id="btn-cinema">▶ Lancer le mode cinéma</button>
  </div>
</aside>

<script>
/* =====================================================================
   1. PARTICULES
   ===================================================================== */
const particlesCanvas = document.getElementById('particles-canvas');
const pctx = particlesCanvas.getContext('2d');
let particles = [];
let particlesActive = true;

function resizeParticles() {
  const dpr = window.devicePixelRatio || 1;
  particlesCanvas.width = window.innerWidth * dpr;
  particlesCanvas.height = window.innerHeight * dpr;
  particlesCanvas.style.width = window.innerWidth + 'px';
  particlesCanvas.style.height = window.innerHeight + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  particles = [];
  const n = Math.round((window.innerWidth * window.innerHeight) / 24000);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18 - 0.02,
      r: Math.random() * 1.6 + 0.5,
      alpha: Math.random() * 0.3 + 0.05,
      hue: Math.random() < 0.8 ? '168,85,247' : '234,179,8'
    });
  }
}

function drawParticles() {
  if (!particlesActive) { pctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  const W = window.innerWidth, H = window.innerHeight;
  pctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
    pctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
    pctx.fill();
  }
}

/* =====================================================================
   2. MOTEUR 3D
   ===================================================================== */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

const view = {
  W: 0, H: 0, dpr: 1,
  yaw: 0.6, pitch: 0.35, zoom: 1,
  vyaw: 0, vpitch: 0,
  autoRotate: true,
  labels: true,
  grid: false,
  paused: false,
  speed: 0.55,
  time: 0,
  bgOpacity: 1.0
};

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const style = getComputedStyle(wrap);
  const padBottom = parseFloat(style.paddingBottom) || 0;
  const w = wrap.clientWidth;
  const h = Math.max(120, wrap.clientHeight - padBottom);
  view.W = w; view.H = h; view.dpr = dpr;
  canvas.width = Math.max(2, Math.round(w * dpr));
  canvas.height = Math.max(2, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function project(p, opt) {
  opt = opt || {};
  const W = view.W, H = view.H;
  const yaw = opt.yaw !== undefined ? opt.yaw : view.yaw;
  const pitch = opt.pitch !== undefined ? opt.pitch : view.pitch;
  const scale = (opt.scale || 1) * Math.min(W, H) * 0.28 * view.zoom;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x1 = p.x * cy - p.z * sy;
  let z1 = p.x * sy + p.z * cy;
  let y1 = p.y;
  let y2 = y1 * cp - z1 * sp;
  let z2 = y1 * sp + z1 * cp;
  const d = 7.5;
  const f = d / (d + z2);
  return { x: W / 2 + x1 * scale * f, y: H / 2 - y2 * scale * f, depth: z2, f };
}

function topY(offset) {
  return Math.max(28, Math.round(view.H * 0.02) + (offset || 0));
}
function bottomY(offset) {
  return view.H - Math.max(40, Math.round(view.H * 0.05) + (offset || 0));
}

function clearCanvas() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.W, view.H);
  if (view.bgOpacity > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${view.bgOpacity * 0.45})`;
    ctx.fillRect(0, 0, view.W, view.H);
  }
  ctx.restore();
  if (view.grid) drawGrid();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const step = 0.5;
  for (let i = -2; i <= 2; i += step) {
    const p1 = project({ x: i, y: -1.2, z: -2 });
    const p2 = project({ x: i, y: -1.2, z: 2 });
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    const p3 = project({ x: -2, y: -1.2, z: i });
    const p4 = project({ x: 2, y: -1.2, z: i });
    ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
  }
}

function drawLine(a, b, color, width, dash) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color || '#fff';
  ctx.lineWidth = width || 2.5;
  if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawArrow(a, b, color, width) {
  drawLine(a, b, color, width || 3);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const L = 13;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - L * Math.cos(ang - 0.4), b.y - L * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - L * Math.cos(ang + 0.4), b.y - L * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color || '#fff';
  ctx.fill();
}

function label(text, p, color, size, italic) {
  if (!view.labels) return;
  const s = Math.max(13, size || 17);
  ctx.save();
  ctx.font = (italic ? 'italic ' : '') + s + 'px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,1)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = color || '#fff';
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
}

function drawPoly(pts, fill, alpha, stroke, lineWidth) {
  if (!pts || pts.length < 2) return;
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  if (fill) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth || 2;
    ctx.stroke();
  }
}

function drawSphere(p, r, color, alpha) {
  const pp = project(p);
  const scale = Math.min(view.W, view.H) * 0.28 * view.zoom;
  ctx.beginPath();
  ctx.arc(pp.x, pp.y, Math.max(2, r * scale * (pp.f || 1)), 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* =====================================================================
   3. FORMULE QUADRATIQUE D'EULER + NEWTON-RAPHSON
   ===================================================================== */

/** Résout ax² + bx + c = 0. Retourne [x₁, x₂] ou [] si discriminant < 0. */
function quadraticRoots(a, b, c) {
  if (Math.abs(a) < 1e-12) {
    if (Math.abs(b) < 1e-12) return [];
    return [-c / b];
  }
  const disc = b * b - 4 * a * c;
  if (disc < 0) return [];
  const sq = Math.sqrt(disc);
  return [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
}

/**
 * Valeurs propres d'une matrice 2×2 [[α, β], [β, γ]] par formule quadratique.
 * det(M − λI) = (α−λ)(γ−λ) − β² = λ² − (α+γ)λ + (αγ − β²) = 0
 * → λ = ((α+γ) ± √((α−γ)² + 4β²)) / 2
 */
function eigen2x2(alpha, beta, gamma) {
  const trace = alpha + gamma;
  const det = alpha * gamma - beta * beta;
  const disc = trace * trace - 4 * det;
  if (disc < 0) return [trace / 2, trace / 2];
  const sq = Math.sqrt(disc);
  return [(trace - sq) / 2, (trace + sq) / 2];
}

/**
 * approxLambda2 via Rayleigh-Ritz sur 2 vecteurs orthonormaux.
 * Au lieu de 6 × 25 itérations de power iteration, on choisit 2 vecteurs
 * de base (constants + aléatoires déterministes), on calcule M = V^T A V
 * (2×2), puis on diagonalise par formule quadratique.
 * Complexité : O(n + |E|) au lieu de O(150·|E|).
 */
function approxLambda2RR(n, edges, d, seedBase) {
  // Vecteur v1 = 1/√n (direction triviale λ₁ = d)
  const sqn = Math.sqrt(n);
  // Vecteur v2 = aléatoire orthogonal à v1
  const rng = makeRng(seedBase);
  let v2 = new Array(n).fill(0).map(() => rng() - 0.5);
  const mean2 = v2.reduce((a, b) => a + b, 0) / n;
  v2 = v2.map(x => x - mean2);
  const norm2 = Math.hypot(...v2) || 1;
  v2 = v2.map(x => x / norm2);

  // Calcul des produits scalaires dans la base (v1, v2) :
  // A v1 = d v1 (car d-régulier), donc α = d
  // A v2 : calcul des coefficients
  const Av2 = new Array(n).fill(0);
  for (const [i, j] of edges) { Av2[i] += v2[j]; Av2[j] += v2[i]; }
  // β = ⟨v1, A v2⟩ = (1/√n) Σ (A v2)_i = d · ⟨v1, v2⟩ = 0 (car v2 ⊥ 1)
  // en pratique β ≈ 0 à tolérance près
  let sumAv2 = 0;
  for (let i = 0; i < n; i++) sumAv2 += Av2[i];
  const beta = sumAv2 / sqn;
  // γ = ⟨v2, A v2⟩ = quotient de Rayleigh
  let gamma = 0;
  for (let i = 0; i < n; i++) gamma += v2[i] * Av2[i];

  // Matrice 2×2 [[d, beta], [beta, gamma]]
  const [l1, l2] = eigen2x2(d, beta, gamma);
  // λ₁ devrait être ≈ d, λ₂ = l'autre valeur. On prend |λ₂|.
  const candidates = [l1, l2].map(Math.abs).sort((a, b) => a - b);
  // Le plus petit en valeur absolue n'est pas forcément λ₂ : on prend max(|l|) ≠ d
  const nonTrivial = candidates.filter(v => Math.abs(v - d) > 0.1);
  return nonTrivial.length > 0 ? Math.max(...nonTrivial) : 0;
}

/**
 * Point fixe du flot Allen–Cahn par Newton-Raphson.
 * Équation : 0 = −g_i + μ x_i (1 − x_i²), soit μ x_i³ − μ x_i + g_i = 0.
 * Newton : x_{k+1} = x_k − f(x_k) / f'(x_k)
 * f'(x) = 3μ x² − μ.
 * Convergence quadratique en ~5 itérations.
 */
function allenCahnFixedPoint(g, mu) {
  // g_i = 0.5 * Σ_{j ∈ N(i)} x_j (calculé à l'extérieur)
  // Pour x_i = 0, la solution triviale est x_i = g_i / μ (linéarisation).
  // Point fixe stable : on résout μ x³ − μ x + g = 0 par Newton.
  if (Math.abs(g) < 1e-10) return 0;
  // Start: x = sign(g) (heuristique)
  let x = g > 0 ? 1 : -1;
  for (let k = 0; k < 20; k++) {
    const f = mu * x * x * x - mu * x + g;
    const fp = 3 * mu * x * x - mu;
    if (Math.abs(fp) < 1e-10) break;
    const dx = f / fp;
    x -= dx;
    x = Math.max(-1.2, Math.min(1.2, x));
    if (Math.abs(dx) < 1e-6) break;
  }
  return Math.max(-1, Math.min(1, x));
}

/**
 * Variante rapide de allenCahnFlow : au lieu de 900 pas de flot,
 * on cherche directement le point fixe stable par Newton-Raphson
 * sur chaque coordonnée, en 3 passes (pour stabiliser g_i).
 * Complexité : O(3 · |E| + 20 · n) au lieu de O(900 · |E|).
 */
function allenCahnFast(x0, edges, n, mu) {
  let x = x0.slice();
  for (let pass = 0; pass < 3; pass++) {
    const g = new Array(n).fill(0);
    for (const [i, j] of edges) { g[i] += 0.5 * x[j]; g[j] += 0.5 * x[i]; }
    for (let i = 0; i < n; i++) {
      x[i] = allenCahnFixedPoint(g[i], mu);
    }
  }
  return x;
}

/* =====================================================================
   4. UTILITAIRES GRAPHES
   ===================================================================== */
const CLUSTER_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4', '#f97316', '#ec4899'];

function buildGraph(n, dens) {
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const edges = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const h = ((i * 17 + j * 31) % 100) / 100;
      if (h < dens) edges.push([i, j]);
    }
  }
  return { verts, edges, n };
}

function cutOf(edges, side) {
  let c = 0;
  for (const [i, j] of edges) if (side[i] !== side[j]) c++;
  return c;
}

function exactMaxCut(n, edges) {
  if (n > 16) return { value: -1, side: null };
  let best = -1, bestMask = 0;
  const count = 1 << (n - 1);
  for (let mask = 0; mask < count; mask++) {
    let score = 0;
    for (const [i, j] of edges) {
      const si = i === 0 ? 1 : ((mask >> (i - 1)) & 1 ? 1 : -1);
      const sj = j === 0 ? 1 : ((mask >> (j - 1)) & 1 ? 1 : -1);
      if (si !== sj) score++;
    }
    if (score > best) { best = score; bestMask = mask; }
  }
  const side = new Array(n);
  side[0] = 1;
  for (let i = 1; i < n; i++) side[i] = (bestMask >> (i - 1)) & 1 ? 1 : -1;
  return { value: best, side };
}

function buildPropeller(n, edges) {
  const adj = Array.from({ length: n }, () => []);
  for (const [i, j] of edges) { adj[i].push(j); adj[j].push(i); }
  const cent = Array.from({ length: n }, () => ({ x: 0, y: 0, z: 0 }));
  for (let i = 0; i < n; i++) {
    if (adj[i].length === 0) { cent[i].x = 1; continue; }
    for (const j of adj[i]) {
      const a = 2 * Math.PI * j / n - Math.PI / 2;
      cent[i].x += Math.cos(a);
      cent[i].z += Math.sin(a);
    }
    const len = Math.hypot(cent[i].x, cent[i].z) || 1;
    cent[i].x /= len; cent[i].z /= len;
  }
  return cent;
}

function propellerInit(n, verts, cent) {
  const x = new Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const dot = v.x * cent[i].x + v.z * cent[i].z;
    x[i] = Math.max(-1, Math.min(1, dot * 1.6));
  }
  return x;
}

/** Flot classique (900 pas) — utilisé pour les scènes de démo. */
function allenCahnFlow(x0, edges, n, mu, dt, steps) {
  let x = x0.slice();
  for (let k = 0; k < steps; k++) {
    const g = new Array(n).fill(0);
    for (const [i, j] of edges) { g[i] += 0.5 * x[j]; g[j] += 0.5 * x[i]; }
    for (let i = 0; i < n; i++) {
      g[i] -= mu * x[i] * (1 - x[i] * x[i]);
      x[i] = Math.max(-1, Math.min(1, x[i] - dt * g[i]));
    }
  }
  return x;
}

function spinOf(x) {
  return x.map(v => v >= 0 ? 1 : -1);
}

/* =====================================================================
   5. GÉNÉRATION GRAPHES RAMANUJAN
   ===================================================================== */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randomRegularGraph(n, d, rng) {
  if (n * d % 2 !== 0) return null;
  const stubs = [];
  for (let i = 0; i < n; i++) for (let k = 0; k < d; k++) stubs.push(i);
  for (let attempt = 0; attempt < 10; attempt++) {
    for (let i = stubs.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [stubs[i], stubs[j]] = [stubs[j], stubs[i]];
    }
    const edges = [];
    const seen = new Set();
    let ok = true;
    for (let k = 0; k < stubs.length; k += 2) {
      const i = stubs[k], j = stubs[k + 1];
      if (i === j) { ok = false; break; }
      const key = i < j ? i + ',' + j : j + ',' + i;
      if (seen.has(key)) { ok = false; break; }
      seen.add(key);
      edges.push([i, j]);
    }
    if (ok) return edges;
  }
  return null;
}

function isRamanujanFast(n, edges, d, seed) {
  if (d < 3) return false;
  const lam2 = approxLambda2RR(n, edges, d, seed);
  return lam2 <= 2 * Math.sqrt(d - 1) + 0.15;
}

/* =====================================================================
   7. TEST EMPIRIQUE — DÉCOUPÉ EN MICRO-TÂCHES
   =====================================================================
   Le calcul est découpé en micro-tâches de ~10ms via requestAnimationFrame.
   Chaque micro-tâche traite UN essai. Les résultats sont accumulés dans un
   objet partagé, et le rendu affiche la progression en temps réel.
   ===================================================================== */
const RAMANUJAN_EXACT_MAX_N = 12;

let ramanujanJob = null; // { key, trials, nMin, nMax, dMin, dMax, i, results, ... }

function ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax) {
  return `${numTrials}|${nMin}|${nMax}|${dMin}|${dMax}`;
}

function startRamanujanJob(numTrials, nMin, nMax, dMin, dMax) {
  const key = ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax);
  if (ramanujanJob && ramanujanJob.key === key) return ramanujanJob;
  ramanujanJob = {
    key, numTrials, nMin, nMax, dMin, dMax,
    i: 0,
    results: [],
    balancedCount: 0,
    ramanujanCount: 0,
    minRatio: 1,
    maxRatio: 0,
    worstInstance: null,
    optComputed: 0,
    done: false
  };
  return ramanujanJob;
}

/** Traite un essai. Retourne true si un graphe a été ajouté. */
function processOneTrial(job) {
  const { numTrials, nMin, nMax, dMin, dMax, i } = job;
  if (i >= numTrials) { job.done = true; return false; }
  job.i = i + 1;

  const rng = makeRng(42 + i * 1337);
  const n = nMin + Math.floor(rng() * (nMax - nMin + 1));
  const d = dMin + Math.floor(rng() * (dMax - dMin + 1));
  if (n * d % 2 !== 0) return false;
  if (d >= n) return false;

  const edges = randomRegularGraph(n, d, rng);
  if (!edges) return false;

  if (!isRamanujanFast(n, edges, d, 42 + i * 1337)) return false;
  job.ramanujanCount++;

  const verts = [];
  for (let k = 0; k < n; k++) {
    const a = 2 * Math.PI * k / n;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const cent = buildPropeller(n, edges);
  const x0 = propellerInit(n, verts, cent);
  const xF = allenCahnFast(x0, edges, n, 0.72);
  const side = spinOf(xF);
  const cut = cutOf(edges, side);
  const posCount = side.filter(s => s > 0).length;
  const balanced = posCount >= n/3 && posCount <= 2*n/3;
  if (balanced) job.balancedCount++;

  let opt = -1;
  if (n <= RAMANUJAN_EXACT_MAX_N) {
    opt = exactMaxCut(n, edges).value;
    job.optComputed++;
  }
  const ratio = opt > 0 ? cut / opt : -1;
  job.results.push({ n, d, edges: edges.length, cut, opt, ratio, balanced, posCount });
  if (ratio >= 0) {
    if (ratio < job.minRatio) { job.minRatio = ratio; job.worstInstance = { n, d, cut, opt }; }
    if (ratio > job.maxRatio) job.maxRatio = ratio;
  }
  return true;
}

/** Boucle de calcul : traite des essais jusqu'à épuisement du temps ~10ms. */
function pumpRamanujanJob(job) {
  if (job.done) return;
  const t0 = performance.now();
  while (!job.done && performance.now() - t0 < 10) {
    processOneTrial(job);
  }
  if (!job.done) {
    requestAnimationFrame(() => pumpRamanujanJob(job));
  }
}

function drawRamanujanTest(params) {
  clearCanvas();
  const numTrials = Math.round(params.trials || 60);
  const nMin = params.nMin ?? 8;
  const nMax = params.nMax ?? 12;
  const dMin = params.dMin ?? 4;
  const dMax = params.dMax ?? 6;
  const key = ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax);

  if (!ramanujanJob || ramanujanJob.key !== key) {
    ramanujanJob = startRamanujanJob(numTrials, nMin, nMax, dMin, dMax);
    pumpRamanujanJob(ramanujanJob);
  }

  const job = ramanujanJob;

  if (!job.done) {
    // Progression
    const progress = job.i / job.numTrials;
    const chartX = view.W * 0.15;
    const chartY = view.H * 0.4;
    const chartW = view.W * 0.7;
    const chartH = 30;

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(chartX, chartY, chartW, chartH);
    ctx.fillStyle = 'rgba(234,179,8,0.85)';
    ctx.fillRect(chartX, chartY, chartW * progress, chartH);

    label(`⏳ Calcul en cours… ${Math.round(progress * 100)}%`, {
      x: view.W / 2, y: chartY - 40
    }, '#eab308', 26, true);
    label(`${job.i} / ${job.numTrials} essais · ${job.ramanujanCount} graphes Ramanujan trouvés`, {
      x: view.W / 2, y: chartY + 60
    }, '#fff', 16, true);
    label('Découpage en micro-tâches de 10 ms · ne bloque pas la frame', {
      x: view.W / 2, y: chartY + 90
    }, '#94a3b8', 14, true);
    return;
  }

  drawRamanujanResult(job);
}

function drawRamanujanResult(job) {
  const { results, ramanujanCount, balancedCount, minRatio, maxRatio, worstInstance, optComputed } = job;
  const withOpt = results.filter(r => r.opt > 0);
  const numBins = 20;
  const bins = new Array(numBins).fill(0);
  withOpt.forEach(r => {
    const b = Math.min(numBins - 1, Math.floor(r.ratio * numBins));
    if (b >= 0) bins[b]++;
  });
  const maxBin = Math.max(1, ...bins);

  const chartX = view.W * 0.15;
  const chartY = view.H * 0.25;
  const chartW = view.W * 0.7;
  const chartH = view.H * 0.5;

  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.stroke();

  const barW = chartW / numBins;
  bins.forEach((count, i) => {
    const h = (count / maxBin) * chartH;
    const x = chartX + i * barW;
    const y = chartY + chartH - h;
    ctx.fillStyle = 'rgba(6,182,212,0.7)';
    ctx.fillRect(x + 1, y, barW - 2, h);
  });

  const dAvg = (results.length > 0 ? results.reduce((a, r) => a + r.d, 0) / results.length : 5);
  const alphaD = Math.max(0, 4 * (dAvg - 2 * Math.sqrt(dAvg - 1)) / (9 * dAvg));
  if (alphaD > 0) {
    const refX = chartX + alphaD * chartW;
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(refX, chartY);
    ctx.lineTo(refX, chartY + chartH);
    ctx.stroke();
    ctx.setLineDash([]);
    label(`α_d = ${alphaD.toFixed(3)}`, { x: refX + 40, y: chartY + 15 }, '#eab308', 15, false);
  }

  label('ratio C/OPT', { x: chartX + chartW / 2, y: chartY + chartH + 30 }, '#fff', 16, false);
  label('nombre de graphes', { x: chartX - 30, y: chartY + chartH / 2 }, '#fff', 14, false);

  label(`Tests : ${ramanujanCount} graphes Ramanujan · ${balancedCount} équilibrés (${(balancedCount / Math.max(1, ramanujanCount) * 100).toFixed(1)}%)`, {
    x: view.W / 2, y: topY(4)
  }, '#fff', 16, true);
  label(`Ratio min = ${minRatio.toFixed(3)}  ·  max = ${maxRatio.toFixed(3)}  ·  α_d = ${alphaD.toFixed(3)}  ·  OPT calculés : ${optComputed}`, {
    x: view.W / 2, y: bottomY(30)
  }, minRatio < alphaD ? '#f43f5e' : '#22c55e', 15, true);
  if (minRatio < alphaD && worstInstance) {
    label(`⚠ CONTRE-EXEMPLE : n=${worstInstance.n} d=${worstInstance.d} C=${worstInstance.cut} OPT=${worstInstance.opt} ratio=${minRatio.toFixed(3)} < α_d`, {
      x: view.W / 2, y: bottomY(0)
    }, '#f43f5e', 17, true);
  } else if (balancedCount / Math.max(1, ramanujanCount) < 0.5) {
    label(`⚠ ${(100 - balancedCount / ramanujanCount * 100).toFixed(0)}% déséquilibrés → hypothèse d'équilibre FAUSSE`, {
      x: view.W / 2, y: bottomY(0)
    }, '#f43f5e', 17, true);
  } else {
    label(`✓ Théorème validé empiriquement sur ${ramanujanCount} graphes`, {
      x: view.W / 2, y: bottomY(0)
    }, '#22c55e', 17, true);
  }

  label('Histogramme C(flot)/OPT sur graphes Ramanujan aléatoires', {
    x: view.W / 2, y: chartY - 15
  }, '#a855f7', 17, true);
}

function drawSynthesis() {
  clearCanvas();
  const cx = view.W / 2;
  const cy = view.H * 0.42;
  const R = Math.min(view.W, view.H) * 0.22;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(34,197,94,0.10)';
  ctx.fill();
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2.5; ctx.stroke();
  label('THÉORÈME CONDITIONNEL', { x: cx, y: cy - R - 30 }, '#22c55e', 18, false);
  label('SI flot donne partition équilibrée', { x: cx, y: cy - 40 }, '#fff', 15, true);
  label('ALORS C(flot) ≥ α_d · OPT', { x: cx, y: cy - 15 }, '#fff', 15, true);
  label(`α_d = 4(d−2√(d−1))/(9d)`, { x: cx, y: cy + 10 }, '#22c55e', 14, true);
  label('pour d ≥ 5, α_d > 0', { x: cx, y: cy + 35 }, '#fff', 13, true);
  label('(déjà prouvé : inégalité spectrale)', { x: cx, y: cy + 60 }, '#94a3b8', 12, true);
  ctx.beginPath(); ctx.arc(cx, cy + R + 130, R * 0.7, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(244,63,94,0.10)';
  ctx.fill();
  ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2.5; ctx.stroke();
  label('FAUX EN GÉNÉRAL', { x: cx, y: cy + R + 130 - R * 0.7 - 15 }, '#f43f5e', 16, false);
  label('Cₙ : C = 0', { x: cx, y: cy + R + 130 - 10 }, '#fff', 13, true);
  label('Petersen : |S| ≪ n', { x: cx, y: cy + R + 130 + 10 }, '#fff', 13, true);
  label('→ pas de garantie universelle', { x: cx, y: cy + R + 130 + 30 }, '#f43f5e', 13, true);
  drawArrow({ x: cx, y: cy + R + 10 }, { x: cx, y: cy + R + 130 - R * 0.7 - 20 }, '#eab308', 3);
  label('Question résiduelle : sur quels graphes Ramanujan l\'équilibre tient-il ?', {
    x: view.W / 2, y: bottomY(0)
  }, '#eab308', 16, true);
}

let currentScene = STORY[0];
let currentParams = {};
let storyIndex = 0;
let cinemaMode = false;
let cinemaInterval = null;

function renderSceneList() {
  const ul = document.getElementById('scene-list');
  ul.innerHTML = '';
  STORY.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="tag ${s.tag.toLowerCase()}">${s.tag}</span>${s.title}`;
    li.addEventListener('click', () => {
      if (cinemaMode) toggleCinema();
      storyIndex = i;
      selectScene(i);
    });
    if (s === currentScene) li.classList.add('active');
    ul.appendChild(li);
  });
}

function renderParams() {
  const box = document.getElementById('param-box');
  box.innerHTML = '';
  if (!currentScene.params || currentScene.params.length === 0) {
    box.innerHTML = '<div style="color:#666;font-style:italic;font-size:0.9rem;">Aucun paramètre.</div>';
    return;
  }
  currentScene.params.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';
    if (p.type === 'bool') {
      const btn = document.createElement('button');
      btn.textContent = (currentParams[p.key] ? '✓ ' : '✗ ') + p.label;
      btn.style.cssText = 'width:100%;text-align:left;font-size:0.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--panel-border);background:' + (currentParams[p.key] ? 'var(--accent-purple)' : 'rgba(255,255,255,0.06)') + ';color:white;cursor:pointer;';
      btn.addEventListener('click', () => {
        currentParams[p.key] = !currentParams[p.key];
        renderParams();
      });
      div.appendChild(btn);
    } else {
      const lab = document.createElement('label');
      lab.innerHTML = `<span>${p.label}</span><span style="color:var(--accent-gold);">${currentParams[p.key]}</span>`;
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = p.min; inp.max = p.max; inp.step = p.step;
      inp.value = currentParams[p.key];
      inp.addEventListener('input', () => {
        currentParams[p.key] = parseFloat(inp.value);
        lab.querySelector('span:last-child').textContent = inp.value;
      });
      div.appendChild(lab);
      div.appendChild(inp);
    }
    box.appendChild(div);
  });
}

  const lBox = document.getElementById('legend-left');

  [lBox, rBox].forEach(el => {
    el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.transform = '';

    ).join('') + `</ul>` +
    (currentScene.legendLeft.eq ? `<div class="eq" id="eq-left"></div>` : '');
  rBox.innerHTML = `<h4>${currentScene.legendRight.title}</h4><ul>` +
    currentScene.legendRight.items.map(it =>
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendRight.eq ? `<div class="eq" id="eq-right"></div>` : '');

function selectScene(index) {
  if (index < 0 || index >= STORY.length || !STORY[index]) {
    console.warn('selectScene: index invalide', index);
    return;
  }
  storyIndex = index;
  currentScene = STORY[index];
  currentParams = {};
  if (currentScene.params) {
    currentScene.params.forEach(p => currentParams[p.key] = p.value);
  }
  document.getElementById('scene-title').textContent = currentScene.title;
  const cap = document.getElementById('scene-caption');
  if (cap) {
    if (currentScene.caption) {
      cap.textContent = currentScene.caption;
      cap.style.display = 'block';
    } else {
      cap.textContent = '';
      cap.style.display = 'none';
    }
  }
  const eqEl = document.getElementById('scene-eq');
  try {
    if (window.katex) katex.render(currentScene.tex, eqEl, { throwOnError: false, displayMode: true });
    else eqEl.textContent = currentScene.tex;
  } catch (_) {
    eqEl.textContent = currentScene.tex;
  }
  document.getElementById('description').innerHTML = currentScene.desc;
  renderSceneList();
  renderParams();
  renderLegends();
  updateTimelineUI();
  view.yaw = 0.55; view.pitch = 0.32; view.zoom = 1;
  view.vyaw = 0; view.vpitch = 0;
  // Reset du job si on change de scène
  if (currentScene.id !== 'empirical') {
    ramanujanJob = null;
  }
}

function togglePanel(force) {
  const panel = document.getElementById('panel');
  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn-panel');
  const open = force !== undefined ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  stage.classList.toggle('panel-open', open);
  if (btn) btn.classList.toggle('on', open);
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  [lBox, rBox].forEach(el => { el.style.left = ''; el.style.right = ''; el.style.top = ''; el.style.transform = ''; });
  setTimeout(() => { resizeCanvas(); resizeParticles(); }, 320);
}

function toggleCinema() {
  cinemaMode = !cinemaMode;
  const btn = document.getElementById('btn-cinema');
  if (cinemaMode) {
    btn.classList.add('playing');
    btn.textContent = '⏸ Arrêter le mode cinéma';
    cinemaInterval = setInterval(() => {
      storyIndex = (storyIndex + 1) % STORY.length;
      selectScene(storyIndex);
    }, 9000);
  } else {
    btn.classList.remove('playing');
    btn.textContent = '▶ Lancer le mode cinéma';
    clearInterval(cinemaInterval);
  }
}

document.getElementById('timeline-slider').addEventListener('input', function () {
  if (cinemaMode) toggleCinema();
  const idx = parseInt(this.value);
  if (idx !== storyIndex) selectScene(idx);
});
document.getElementById('btn-cinema').addEventListener('click', toggleCinema);
document.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePanel(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); selectScene((storyIndex + 1) % STORY.length); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); selectScene((storyIndex - 1 + STORY.length) % STORY.length); }
});

/* =====================================================================
   10. LOOP
   ===================================================================== */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (!view.paused) {
    view.time += dt * view.speed;
    if (view.autoRotate) {
      view.vyaw += (0.16 - view.vyaw) * dt * 2;
    } else {
      view.vyaw *= Math.pow(0.92, dt * 60);
      view.vpitch *= Math.pow(0.92, dt * 60);
    }
    view.yaw += view.vyaw * dt;
    view.pitch += view.vpitch * dt;
  }
  if (view.W === 0) resizeCanvas();
  try {
    if (currentScene && currentScene.draw) currentScene.draw(currentParams);
  } catch (err) {
    console.error(err);
  }
  drawParticles();
  requestAnimationFrame(loop);
}

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  view.vyaw = 0; view.vpitch = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.yaw += dx * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch + dy * 0.005));
  view.vyaw = dx * 0.005 / 0.016;
  view.vpitch = dy * 0.005 / 0.016;
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.zoom = Math.max(0.3, Math.min(4, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

document.getElementById('speed').addEventListener('input', function () {
  view.speed = parseFloat(this.value);
  document.getElementById('speed-val').textContent = this.value;
});
document.getElementById('bg-opacity').addEventListener('input', function () {
  view.bgOpacity = parseFloat(this.value);
  document.getElementById('bg-val').textContent = this.value;
});
document.getElementById('btn-auto').addEventListener('click', function () {
  view.autoRotate = !view.autoRotate;
  this.classList.toggle('on', view.autoRotate);
});
document.getElementById('btn-pause').addEventListener('click', function () {
  view.paused = !view.paused;
  this.classList.toggle('on', view.paused);
});
document.getElementById('btn-grid').addEventListener('click', function () {
  view.grid = !view.grid;
  this.classList.toggle('on', view.grid);
});
document.getElementById('btn-labels').addEventListener('click', function () {
  view.labels = !view.labels;
  this.classList.toggle('on', view.labels);
});
document.getElementById('btn-particles').addEventListener('click', function () {
  particlesActive = !particlesActive;
  this.classList.toggle('on', particlesActive);
});
document.getElementById('btn-panel').addEventListener('click', function () { togglePanel(); });
document.getElementById('btn-full').addEventListener('click', function () {
  const stage = document.getElementById('stage');
  if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => setTimeout(() => { resizeCanvas(); resizeParticles(); }, 150));
window.addEventListener('resize', () => { resizeCanvas(); resizeParticles(); });

function makeLegendsDraggable() {
  document.querySelectorAll('.floating-legend').forEach(el => {
    if (el._dragReady) return;
    el._dragReady = true;
    let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    el.addEventListener('pointerdown', e => {
      isDragging = true;
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      const rect = el.getBoundingClientRect();
      const parent = el.offsetParent || document.body;
      const parentRect = parent.getBoundingClientRect();
      origLeft = rect.left - parentRect.left;
      origTop = rect.top - parentRect.top;
      el.style.left = origLeft + 'px';
      el.style.top = origTop + 'px';
      el.style.right = 'auto';
      el.style.transform = 'none';
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!isDragging) return;
      el.style.left = (origLeft + e.clientX - startX) + 'px';
      el.style.top = (origTop + e.clientY - startY) + 'px';
    });
    el.addEventListener('pointerup', e => {
      isDragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  });
}

function boot() {
  resizeCanvas();
  resizeParticles();
  selectScene(0);
  const slider = document.getElementById('timeline-slider');
  if (slider) slider.max = STORY.length - 1;
  requestAnimationFrame(loop);
}

if (window.katex) boot();
else window.addEventListener('load', boot);
</script>
