<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Propeller — Cinéma</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #050508;
    --text-main: #e8e6e3;
    --text-muted: #a0a0b0;
    --panel-bg: rgba(15, 15, 22, 0.85);
    --panel-border: rgba(150, 150, 255, 0.25);
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --accent-gold: #eab308;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --font-title: clamp(2.2rem, 4vw, 3.5rem);
    --font-eq: clamp(1.4rem, 2.2vw, 2rem);
    --font-desc: clamp(1.1rem, 1.5vw, 1.35rem);
    --font-legend: 1.1rem;
    --panel-width: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Times New Roman", Times, serif;
    background-color: var(--bg);
    color: var(--text-main);
    overflow: hidden;
  }

  /* ============ STAGE & LAYOUT ============ */
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #stage.panel-open {
    padding-left: var(--panel-width);
  }
  #particles-canvas {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }

  /* ---------- HEADER ---------- */
  #stage-header {
    position: relative; z-index: 5;
    padding: 24px 40px 5px;
    text-align: center;
    flex: 0 0 auto;
  }
  #scene-title {
    font-size: var(--font-title);
    font-weight: 400;
    margin: 0;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
  }
  #scene-eq {
    margin: 15px auto 0;
    font-size: var(--font-eq);
    color: #ffffff;
    display: inline-block;
    min-height: 1.2em;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
  }

  /* ---------- MAIN CANVAS AREA ---------- */
  #canvas-wrap {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    margin: 10px 0 20px;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #canvas-wrap canvas {
    width: 100%; height: 100%; display: block;
    cursor: grab;
    touch-action: none;
  }
  #canvas-wrap canvas:active { cursor: grabbing; }

  /* ---------- FLOATING LEGENDS ---------- */
  .floating-legend {
    position: absolute; z-index: 10;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px 24px;
    font-size: var(--font-legend);
    line-height: 1.5;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    pointer-events: none;
    max-width: 340px;
    transition: all 0.3s ease;
  }
  .floating-legend.left { left: 3%; top: 50%; transform: translateY(-50%); }
  .floating-legend.right { right: 3%; top: 50%; transform: translateY(-50%); }
  #stage.panel-open .floating-legend.left { left: 2%; }
  
  .floating-legend h4 {
    margin: 0 0 14px;
    font-family: "Consolas", monospace;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-purple);
    border-bottom: 2px solid rgba(168, 85, 247, 0.4);
    padding-bottom: 8px;
  }
  .floating-legend ul { list-style: none; margin: 0; padding: 0; }
  .floating-legend li {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .floating-legend .swatch {
    flex: 0 0 auto; width: 16px; height: 16px;
    border-radius: 4px; margin-top: 4px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .floating-legend .eq {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-style: italic;
    color: #ffffff;
    font-size: 1.2rem;
    text-align: center;
  }

  /* ---------- DESCRIPTION BOTTOM ---------- */
  #description-wrap {
    position: absolute; bottom: 25px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 85%; max-width: 1100px;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  #description {
    background: rgba(10, 10, 15, 0.95);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px 30px;
    font-size: var(--font-desc);
    line-height: 1.6;
    color: #e0e0e5;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    pointer-events: auto;
  }
  #description strong { color: #fff; font-weight: 700; }
  #description em { color: var(--accent-cyan); font-style: italic; }

  /* ---------- TOOLBAR & PANEL ---------- */
  #toolbar {
    position: absolute; top: 16px; left: 16px;
    display: flex; gap: 12px; z-index: 40;
    transition: transform 0.3s ease;
  }
  #toolbar button {
    font-family: inherit; font-size: 1rem;
    padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(15, 15, 22, 0.85);
    color: var(--text-main); cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  #toolbar button:hover { background: rgba(40, 40, 60, 0.95); border-color: var(--accent-purple); }
  #toolbar button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #panel {
    position: fixed; top: 0; left: 0;
    width: var(--panel-width); height: 100vh;
    background: rgba(12, 12, 18, 0.98);
    border-right: 1px solid var(--panel-border);
    overflow-y: auto; padding: 24px;
    z-index: 60; transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(20px);
    box-shadow: 10px 0 50px rgba(0,0,0,0.5);
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 1.4rem; margin: 0 0 24px; color: var(--accent-purple); font-weight: 400; }
  
  .scene-list { list-style: none; padding: 0; margin: 0 0 24px; }
  .scene-list li {
    padding: 12px 16px; border-radius: 8px; cursor: pointer;
    font-size: 1.05rem; margin-bottom: 8px;
    border: 1px solid transparent; transition: all 0.2s;
    background: rgba(255,255,255,0.02);
  }
  .scene-list li:hover { background: rgba(255,255,255,0.08); }
  .scene-list li.active {
    background: rgba(168, 85, 247, 0.15);
    border-color: var(--accent-purple);
  }
  .scene-list li .tag {
    display: inline-block; font-family: "Consolas", monospace;
    font-size: 0.8rem; background: #333; padding: 3px 8px;
    border-radius: 4px; margin-right: 12px; color: #fff;
  }
  .scene-list li .tag.thm { background: #8e44ad; }
  .scene-list li .tag.lem { background: #2980b9; }
  .scene-list li .tag.cor { background: #d68910; }
  .scene-list li .tag.app { background: #b03a6b; }
  .scene-list li .tag.ex { background: #27ae60; }

  .params { margin-bottom: 24px; }
  .params h3 {
    font-size: 0.9rem; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-muted);
    margin: 0 0 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }
  .param { margin-bottom: 16px; font-size: 1rem; }
  .param label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .param input[type=range] { width: 100%; accent-color: var(--accent-purple); height: 6px; }

  /* Toggle buttons */
  .toggle-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .toggle-row button {
    font-family: inherit; font-size: 0.9rem;
    padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.05); color: var(--text-main);
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-row button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  .shape-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .shape-toggle {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
    cursor: pointer; font-size: 0.95rem; transition: all 0.15s;
  }
  .shape-toggle.on { background: rgba(168, 85, 247, 0.2); border-color: var(--accent-purple); }
  .shape-toggle input { accent-color: var(--accent-purple); width: 16px; height: 16px; }
  .shape-toggle .mini { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }

  #rec-badge {
    display: none; position: fixed; top: 20px; right: 20px;
    background: #ef4444; color: #fff; padding: 10px 20px;
    border-radius: 30px; font-family: "Consolas", monospace;
    font-size: 1.1rem; z-index: 200; box-shadow: 0 0 30px #ef4444;
    animation: pulse 1.5s infinite;
  }
  #rec-badge.show { display: block; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* ============ MODAL FOR RECORDING ============ */
  #rec-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.9); z-index: 100;
    justify-content: center; align-items: center;
    backdrop-filter: blur(5px);
  }
  #rec-modal.show { display: flex; }
  #rec-modal .box {
    background: #15151e; border: 1px solid var(--panel-border);
    padding: 40px; border-radius: 16px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }
  #rec-modal h3 { font-size: 1.8rem; margin: 0 0 15px; font-weight: 400; }
  #rec-modal p { color: #aaa; margin-bottom: 25px; font-size: 1.1rem; }
  #rec-modal select {
    padding: 12px; margin: 10px 0; background: #222; color: #fff;
    border: 1px solid #444; border-radius: 8px; font-family: inherit; font-size: 1.1rem;
    width: 100%;
  }
  #rec-modal button {
    padding: 12px 24px; background: var(--accent-red); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 1.1rem;
    margin-top: 15px; width: 100%; transition: background 0.2s;
  }
  #rec-modal button:hover { background: #dc2626; }
  #rec-modal button.cancel { background: #333; margin-top: 10px; }
  #rec-modal button.cancel:hover { background: #444; }
</style>
</head>
<body>

<div id="rec-badge">● REC</div>

<main id="stage">
  <canvas id="particles-canvas"></canvas>

  <div id="toolbar">
    <button id="btn-panel">☰ Scènes & Paramètres</button>
    <button id="btn-full">⛶ Plein écran</button>
  </div>

  <header id="stage-header">
    <h1 id="scene-title">Gaussian Propeller</h1>
    <div id="scene-eq"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="view"></canvas>
    <div id="legend-left" class="floating-legend left"></div>
    <div id="legend-right" class="floating-legend right"></div>
  </div>

  <div id="description-wrap">
    <div id="description"></div>
  </div>
</main>

<aside id="panel">
  <h2>Gaussian Propeller</h2>
  <ul class="scene-list" id="scene-list"></ul>

  <div class="params">
    <h3>Paramètres de la figure</h3>
    <div id="param-box"></div>
  </div>

  <div class="params">
    <h3>Rendu & Physique</h3>
    <div class="param">
      <label><span>Inertie</span><span id="damp-val">0.92</span></label>
      <input type="range" id="damp" min="0.80" max="0.99" step="0.005" value="0.92">
    </div>
    <div class="param">
      <label><span>Vitesse</span><span id="speed-val">0.55</span></label>
      <input type="range" id="speed" min="0" max="2" step="0.01" value="0.55">
    </div>
    <div class="toggle-row">
      <button id="btn-auto" class="on">↻ Auto</button>
      <button id="btn-wireframe">🕸 Fil de Fer</button>
      <button id="btn-labels" class="on">🏷 Labels</button>
      <button id="btn-particles" class="on">✦ Particules</button>
    </div>
  </div>

  <div class="params">
    <h3>Polyèdres (Easter Eggs)</h3>
    <div class="shape-grid" id="shape-grid"></div>
  </div>

  <div class="params">
    <h3>Enregistrement</h3>
    <button id="btn-record" style="width:100%; padding:14px; background:var(--accent-red); color:#fff; border:none; border-radius:8px; font-family:inherit; font-size:1.1rem; cursor:pointer; font-weight:bold;">● Enregistrer la scène</button>
  </div>
</aside>

<div id="rec-modal">
  <div class="box">
    <h3>Enregistrement Vidéo</h3>
    <p>Choisir la résolution de la vidéo</p>
    <select id="res-select">
      <option value="1080">1920×1080 (Full HD)</option>
      <option value="720">1280×720 (HD)</option>
      <option value="2160">3840×2160 (4K)</option>
    </select>
    <button id="btn-start-rec">Démarrer l'enregistrement</button>
    <button id="btn-cancel-rec" class="cancel">Annuler</button>
  </div>
</div>

<script>
/* =====================================================================
   1. PARTICULES DE FOND
   ===================================================================== */
const particlesCanvas = document.getElementById('particles-canvas');
const pctx = particlesCanvas.getContext('2d');
let particles = [];
let particlesActive = true;

function resizeParticles() {
  const dpr = window.devicePixelRatio || 1;
  particlesCanvas.width = window.innerWidth * dpr;
  particlesCanvas.height = window.innerHeight * dpr;
  particlesCanvas.style.width = window.innerWidth + 'px';
  particlesCanvas.style.height = window.innerHeight + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  particles = [];
  const n = Math.round((window.innerWidth * window.innerHeight) / 25000);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2 - 0.02,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.3 + 0.05,
      hue: Math.random() < 0.8 ? '168,85,247' : '234,179,8'
    });
  }
}

function drawParticles() {
  if (!particlesActive) { pctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  const W = window.innerWidth, H = window.innerHeight;
  pctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;
    
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
    pctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
    pctx.fill();
  }
}

/* =====================================================================
   2. MOTEUR 3D ET OUTILS
   ===================================================================== */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

const view = {
  W: 0, H: 0, dpr: 1,
  yaw: 0.5, pitch: 0.3, zoom: 1,
  vyaw: 0, vpitch: 0,
  autoRotate: true,
  physics: true,
  labels: true,
  wireframe: false,
  damping: 0.92,
  gravity: 0.35,
  speed: 0.55,
  time: 0,
  shapes: {
    cube: false, octahedron: false, icosahedron: false,
    torus: false, helicoid: false, spiral: false,
    tetrahedron: false, dodecahedron: false
  }
};

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  view.W = w; view.H = h; view.dpr = dpr;
  canvas.width = Math.max(2, Math.round(w * dpr));
  canvas.height = Math.max(2, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function project(p, opt) {
  opt = opt || {};
  const W = view.W, H = view.H;
  const yaw = opt.yaw !== undefined ? opt.yaw : view.yaw;
  const pitch = opt.pitch !== undefined ? opt.pitch : view.pitch;
  const scale = (opt.scale || 1) * Math.min(W, H) * 0.3 * view.zoom;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x1 = p.x * cy - p.z * sy;
  let z1 = p.x * sy + p.z * cy;
  let y1 = p.y;
  let y2 = y1 * cp - z1 * sp;
  let z2 = y1 * sp + z1 * cp;
  let x2 = x1;
  const d = 7.5;
  const f = d / (d + z2);
  return { x: W / 2 + x2 * scale * f, y: H / 2 - y2 * scale * f, depth: z2, f };
}

function clearCanvas() {
  ctx.clearRect(0, 0, view.W, view.H);
}

function drawPoly(pts, fill, alpha, stroke, lineWidth = 2) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  if (fill && !view.wireframe) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
}

function drawLine(a, b, color, width, dash) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color || '#fff';
  ctx.lineWidth = width || 3;
  if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawArrow(a, b, color, width) {
  drawLine(a, b, color, width || 3);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const L = 16;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - L * Math.cos(ang - 0.4), b.y - L * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - L * Math.cos(ang + 0.4), b.y - L * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color || '#fff';
  ctx.fill();
}

function label(text, p, color, size, italic) {
  if (!view.labels) return;
  ctx.save();
  ctx.font = (italic ? 'italic ' : '') + (size || 22) + 'px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,1)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = color || '#fff';
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
}

function rot3(p, ax, ay, az) {
  let { x, y, z } = p;
  let cy = Math.cos(ay), sy = Math.sin(ay);
  let cx = Math.cos(ax), sx = Math.sin(ax);
  let cz = Math.cos(az), sz = Math.sin(az);
  let y1 = y * cx - z * sx;
  let z1 = y * sx + z * cx;
  let x2 = x * cy + z1 * sy;
  let z2 = -x * sy + z1 * cy;
  let x3 = x2 * cz - y1 * sz;
  let y3 = x2 * sz + y1 * cz;
  return { x: x3, y: y3, z: z2 };
}

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.min(255, Math.max(0, Math.round(r * factor)));
  g = Math.min(255, Math.max(0, Math.round(g * factor)));
  b = Math.min(255, Math.max(0, Math.round(b * factor)));
  return `rgb(${r},${g},${b})`;
}

function cross(a, b) { return { x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x }; }
function normalize(v) { const n = Math.hypot(v.x, v.y, v.z) || 1; return { x: v.x/n, y: v.y/n, z: v.z/n }; }

/* =====================================================================
   3. GÉOMÉTRIE DES FORMES (Easter Eggs)
   ===================================================================== */
function makeCube(size) {
  const s = size || 0.7;
  const v = [
    [-s,-s,-s],[ s,-s,-s],[ s, s,-s],[-s, s,-s],
    [-s,-s, s],[ s,-s, s],[ s, s, s],[-s, s, s]
  ].map(a => ({ x: a[0], y: a[1], z: a[2] }));
  const f = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  return { verts: v, faces: f, color: '#ef4444' };
}
function makeOctahedron(size) {
  const s = size || 0.9;
  const v = [[ s,0,0],[-s,0,0],[0, s,0],[0,-s,0],[0,0, s],[0,0,-s]]
    .map(a => ({ x: a[0], y: a[1], z: a[2] }));
  const f = [[0,2,4],[2,1,4],[1,3,4],[3,0,4],[2,0,5],[1,2,5],[3,1,5],[0,3,5]];
  return { verts: v, faces: f, color: '#3b82f6' };
}
function makeIcosahedron(size) {
  const s = size || 0.8;
  const t = (1 + Math.sqrt(5)) / 2;
  const raw = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  const norm = Math.hypot(1, t);
  const v = raw.map(a => ({ x: a[0]/norm*s, y: a[1]/norm*s, z: a[2]/norm*s }));
  const f = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  return { verts: v, faces: f, color: '#a855f7' };
}
function makeTorus(R, r, nu, nv) {
  R = R || 0.9; r = r || 0.35; nu = nu || 24; nv = nv || 14;
  const verts = [], faces = [];
  for (let i = 0; i < nu; i++) {
    const u = 2 * Math.PI * i / nu;
    for (let j = 0; j < nv; j++) {
      const v = 2 * Math.PI * j / nv;
      verts.push({
        x: (R + r * Math.cos(v)) * Math.cos(u),
        y: r * Math.sin(v),
        z: (R + r * Math.cos(v)) * Math.sin(u)
      });
    }
  }
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const a = i * nv + j;
      const b = ((i + 1) % nu) * nv + j;
      const c = ((i + 1) % nu) * nv + (j + 1) % nv;
      const d = i * nv + (j + 1) % nv;
      faces.push([a, b, c, d]);
    }
  }
  return { verts, faces, color: '#06b6d4' };
}
function makeHelicoid(turns, N) {
  turns = turns || 2.2; N = N || 60;
  const verts = [], faces = [];
  const segs = 24;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ang = turns * 2 * Math.PI * t;
    const rad = 0.15 + 0.75 * t;
    for (let j = 0; j <= segs; j++) {
      const u = j / segs;
      verts.push({
        x: rad * Math.cos(ang + u * 2.4),
        y: -0.6 + 1.2 * t + 0.18 * Math.sin(u * Math.PI * 2),
        z: rad * Math.sin(ang + u * 2.4)
      });
    }
  }
  const row = segs + 1;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      faces.push([a, b, c, d]);
    }
  }
  return { verts, faces, color: '#eab308' };
}
function makeSpiral(turns, N) {
  turns = turns || 3; N = N || 140;
  const verts = [], faces = [];
  const segs = 10;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ang = turns * 2 * Math.PI * t;
    const rad = 0.15 + 0.7 * t;
    const cx = rad * Math.cos(ang);
    const cz = rad * Math.sin(ang);
    const cy = -0.6 + 1.2 * t;
    for (let j = 0; j <= segs; j++) {
      const a = 2 * Math.PI * j / segs;
      const rr = 0.06 + 0.04 * (1 - t);
      verts.push({
        x: cx + rr * Math.cos(a),
        y: cy + rr * Math.sin(a),
        z: cz + rr * Math.sin(a) * 0.5
      });
    }
  }
  const row = segs + 1;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      faces.push([a, b, c, d]);
    }
  }
  return { verts, faces, color: '#e67e22' };
}

function drawMesh(mesh, opts) {
  opts = opts || {};
  const ax = opts.ax || 0, ay = opts.ay || 0, az = opts.az || 0;
  const scale = opts.scale || 1;
  const pos = opts.pos || { x: 0, y: 0, z: 0 };
  const color = opts.color || mesh.color;
  const alpha = opts.alpha != null ? opts.alpha : 0.85;
  const transformed = mesh.verts.map(v => {
    let p = rot3(v, ax, ay, az);
    p.x = p.x * scale + pos.x;
    p.y = p.y * scale + pos.y;
    p.z = p.z * scale + pos.z;
    return p;
  });
  const light = normalize({ x: 0.4, y: 0.7, z: 0.6 });
  const faces = mesh.faces.map(f => {
    const pts = f.map(idx => project(transformed[idx]));
    const depth = pts.reduce((s, p) => s + p.depth, 0) / pts.length;
    let n = { x: 0, y: 0, z: 0 };
    if (f.length >= 3) {
      const a = transformed[f[0]], b = transformed[f[1]], c = transformed[f[2]];
      const u = { x: b.x - a.x, y: b.y - a.y, z: b.z - a.z };
      const w = { x: c.x - a.x, y: c.y - a.y, z: c.z - a.z };
      n = cross(u, w);
      const ln = Math.hypot(n.x, n.y, n.z) || 1;
      n = { x: n.x / ln, y: n.y / ln, z: n.z / ln };
    }
    const dot = Math.max(0, n.x * light.x + n.y * light.y + n.z * light.z);
    const shadeF = 0.35 + 0.65 * dot;
    return { pts, depth, color: shade(color, shadeF), alpha };
  }).sort((a, b) => b.depth - a.depth);
  faces.forEach(f => drawPoly(f.pts, f.color, f.alpha, 'rgba(0,0,0,.35)'));
}

function drawPropeller2D(params) {
  clearCanvas();
  const t = view.time;
  const m = params.m || 3;
  const R = 1.45, N = 80;
  const step = 2 * Math.PI / m;
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4'];
  
  for (let s = 0; s < m; s++) {
    const pulse = 1 + Math.sin(t * 1.5 + s) * 0.03;
    const a0 = s * step - Math.PI / 2 + Math.sin(t * view.speed + s) * 0.05;
    const a1 = a0 + step;
    const pts = [{ x: 0, y: 0, z: 0 }];
    for (let k = 0; k <= N; k++) {
      const a = a0 + (a1 - a0) * (k / N);
      pts.push({ x: R * pulse * Math.cos(a), y: 0, z: R * pulse * Math.sin(a) });
    }
    drawPoly(pts.map(p => project(p)), colors[s % colors.length], params.opacity ?? 0.2, colors[s % colors.length], 3);
  }

  if (params.showCentroids !== false) {
    for (let s = 0; s < m; s++) {
      const am = s * step - Math.PI / 2 + step / 2 + Math.sin(t * view.speed + s) * 0.05;
      const o = project({ x: 0, y: 0, z: 0 });
      const e = project({ x: 0.75 * Math.cos(am), y: 0, z: 0.75 * Math.sin(am) });
      drawArrow(o, e, colors[s % colors.length], 4);
      label('ẑ' + (s + 1), { x: e.x + 15, y: e.y - 15 }, colors[s % colors.length], 22, true);
    }
  }

  if (params.showLabels !== false) {
    for (let s = 0; s < m; s++) {
      const am = s * step - Math.PI / 2 + step / 2;
      const p = project({ x: 1.15 * Math.cos(am), y: 0, z: 1.15 * Math.sin(am) });
      label('S' + (s + 1), p, colors[s % colors.length], 24, false);
    }
  }
}

function drawKernelClustering(params) {
  clearCanvas();
  const t = view.time;
  const k = params.k ?? 3;
  const N = params.N ?? 24;
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308'];

  const nodes = [];
  const clusterCenters = [];
  for (let c = 0; c < k; c++) {
    const a = 2 * Math.PI * c / k;
    clusterCenters.push({ x: 1.0 * Math.cos(a), y: 1.0 * Math.sin(a), z: 0.3 * Math.cos(2*a) });
  }
  for (let i = 0; i < N; i++) {
    const c = i % k;
    const center = clusterCenters[c];
    const angle = (i / N) * Math.PI * 8 + t * view.speed * 0.5;
    const r = 0.35;
    nodes.push({
      x: center.x + r * Math.cos(angle),
      y: center.y + r * Math.sin(angle),
      z: center.z + 0.15 * Math.sin(angle * 2),
      cluster: c
    });
  }

  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      if (nodes[i].cluster === nodes[j].cluster) {
        const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y, nodes[i].z - nodes[j].z);
        if (d < 0.75) {
          const a = project(nodes[i]);
          const b = project(nodes[j]);
          drawLine(a, b, 'rgba(234, 179, 8, 0.4)', 2);
        }
      }
    }
  }

  nodes.forEach(n => {
    const p = project(n);
    ctx.beginPath();
    ctx.arc(p.x + 3, p.y + 3, 8, 0, 2*Math.PI);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, 2*Math.PI);
    ctx.fillStyle = colors[n.cluster % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  clusterCenters.forEach((c, i) => {
    const p = project(c);
    label('C' + (i + 1), { x: p.x, y: p.y - 25 }, colors[i % colors.length], 24, true);
  });

  label("Graphe de Clusters", { x: view.W / 2, y: 40 }, '#fff', 28, false);
  label("Arêtes dorées : paires intra-cluster", { x: view.W / 2, y: view.H - 40 }, '#eab308', 20, true);
}

function drawScoreCones(params) {
  clearCanvas();
  const t = view.time;
  const m = params.m ?? 5;
  const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f1c40f'];
  if (view.shapes.torus) {
    const torus = makeTorus(0.85, 0.3, 28, 16);
    drawMesh(torus, { ax: t * view.speed * 0.6 + 0.4, ay: t * view.speed * 0.9, az: 0, color: '#1abc9c', alpha: 0.8 });
  }
  const o = project({ x: 0, y: 0, z: 0 });
  for (let i = 0; i < m; i++) {
    const baseAng = 2 * Math.PI * i / m + t * view.speed * 0.25;
    const spread = params.spread ?? 0.45;
    const coneR = params.coneR ?? 1.5;
    const dir = normalize({ x: Math.cos(baseAng), y: 0.15 * Math.sin(t + i), z: Math.sin(baseAng) });
    const up = Math.abs(dir.y) > 0.9 ? { x: 0, y: 0, z: 1 } : { x: 0, y: 1, z: 0 };
    const right = normalize(cross(dir, up));
    const up2 = cross(right, dir);
    const pts = [o];
    for (let k = 0; k <= 28; k++) {
      const a = 2 * Math.PI * k / 28;
      const rr = Math.tan(spread) * coneR;
      pts.push(project({
        x: dir.x * coneR + rr * (Math.cos(a) * right.x + Math.sin(a) * up2.x),
        y: dir.y * coneR + rr * (Math.cos(a) * right.y + Math.sin(a) * up2.y),
        z: dir.z * coneR + rr * (Math.cos(a) * right.z + Math.sin(a) * up2.z)
      }));
    }
    if (params.showCones !== false) drawPoly(pts, colors[i % colors.length], 0.15, 'rgba(255,255,255,.08)');
  }
}

function drawProbabilityBound(params) {
  clearCanvas();
  const t = view.time;
  if (view.shapes.helicoid) {
    const hel = makeHelicoid(2.2, 50);
    drawMesh(hel, {
      ax: 0.3 + t * view.speed * 0.2, ay: t * view.speed * 0.5, az: 0,
      pos: { x: 0.6, y: 0, z: 0 }, color: '#f1c40f', alpha: 0.35
    });
  }
  const W = view.W, H = view.H;
  const padY = 60;
  const plotW = W * 0.5, plotH = H - 2 * padY;
  const ox = W * 0.42, oy = padY;
  ctx.strokeStyle = 'rgba(255,255,255,.3)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(ox, oy + plotH); ctx.lineTo(ox + plotW, oy + plotH);
  ctx.moveTo(ox, oy + plotH); ctx.lineTo(ox, oy);
  ctx.stroke();
  const A = params.A ?? 0.929;
  function plotCurve(fn, color, width) {
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 200; i++) {
      const r = (2/3) * i / 200;
      const p = fn(r);
      const x = ox + plotW * (r / (2/3));
      const y = oy + plotH - plotH * Math.min(1, Math.max(0, p / 0.6));
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = width || 2.4; ctx.stroke();
  }
  if (params.showQuad !== false) plotCurve(r => A * r * r, '#e74c3c');
  if (params.showLin !== false) plotCurve(r => 0.415 * r + 0.15 * r * r, '#3498db');
  plotCurve(r => r * r, '#555');
  for (let k = 0; k < 3; k++) {
    const u = ((t * 0.4 + k / 3) % 1);
    const r = (2/3) * u;
    const p = A * r * r;
    const x = ox + plotW * u;

    ctx.fillStyle = '#f1c40f'; ctx.fill();
  }

  label('P ≥ 0.415 r + 0.15 r²', { x: ox + plotW * 0.55, y: oy + 55 }, '#3498db', 14, false);
}

function drawTwoScores(params) {
  clearCanvas();
  const t = view.time;
  const tt = params.t ?? 0.11;
  const aj = params.aj ?? 0.35;
  const ak = params.ak ?? 0.25;
  if (view.shapes.spiral) {
    const sp = makeSpiral(3, 100);
    drawMesh(sp, {
      ax: 0.2 + t * view.speed * 0.3, ay: t * view.speed * 0.6, az: 0,
      pos: { x: -0.3, y: 0, z: 0 }, color: '#e67e22', alpha: 0.4
    });
  }
  const axes = [
    { from: { x: -1.2, y: 0, z: 0 }, to: { x: 1.2, y: 0, z: 0 }, label: 'T', color: '#888' },
    { from: { x: 0, y: -1.2, z: 0 }, to: { x: 0, y: 1.2, z: 0 }, label: 'Y_j', color: '#3498db' },
    { from: { x: 0, y: 0, z: -1.2 }, to: { x: 0, y: 0, z: 1.2 }, label: 'Y_k', color: '#2ecc71' }
  ];
  axes.forEach(ax => {
    const a = project(ax.from), b = project(ax.to);
    drawLine(a, b, ax.color, 1.2, [4, 4]);
    label(ax.label, { x: b.x + 12, y: b.y - 6 }, ax.color, 14, true);
  });
  const T0 = 1.0;
  const yjMax = (1 + aj) * tt * T0;
  const ykMax = (1 + ak) * tt * T0;
  const p1 = project({ x: T0, y: yjMax, z: ykMax });
  const p2 = project({ x: T0, y: -2 * yjMax, z: ykMax });
  const p3 = project({ x: T0, y: yjMax, z: -2 * ykMax });
  drawPoly([p1, p2, p3], '#e74c3c', 0.2, 'rgba(255,255,255,.1)');
  const sigmaJ = Math.sqrt(Math.max(0.01, tt * tt * (1 + aj) * (1 + aj) / 2));
  const sigmaK = Math.sqrt(Math.max(0.01, tt * tt * (1 + ak) * (1 + ak) / 2));
  const pts = [];
  for (let k = 0; k <= 40; k++) {
    const a = 2 * Math.PI * k / 40;
    pts.push(project({ x: T0, y: sigmaJ * Math.cos(a), z: sigmaK * Math.sin(a) }));
  }
  drawPoly(pts, '#3498db', 0.15, 'rgba(52,152,219,.6)');
  label('Densité (U,V) ≤ M', { x: p1.x, y: p1.y - 24 }, '#3498db', 14, true);
  const tp = ((t * 0.5) % 2);
  const pT = project({ x: tp - 1, y: 0, z: 0 });
  ctx.beginPath(); ctx.arc(pT.x, pT.y, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#d4af37'; ctx.fill();
}

function drawGaussianMax(params) {
  clearCanvas();
  const t = view.time;
  const k = params.k ?? 3;
  const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f1c40f'];
  const R = 1.0;
  if (view.shapes.cube) {
    const cube = makeCube(0.35);
    drawMesh(cube, { ax: t * view.speed * 0.6, ay: t * view.speed * 0.9, az: t * view.speed * 0.4, color: '#555', alpha: 0.7 });
  }
  const vectors = [];
  for (let i = 0; i < k; i++) {
    const a = 2 * Math.PI * i / k - Math.PI / 2 + t * view.speed * 0.2;
    vectors.push({ x: R * Math.cos(a), y: R * Math.sin(a), z: 0.15 * Math.sin(2 * a + t) });
  }
  let mean = { x: 0, y: 0, z: 0 };
  vectors.forEach(v => { mean.x += v.x / k; mean.y += v.y / k; mean.z += v.z / k; });
  const o = project({ x: 0, y: 0, z: 0 });
  const om = project(mean);
  vectors.forEach((v, i) => {
    const u = { x: v.x - mean.x, y: v.y - mean.y, z: v.z - mean.z };
    const e = project(u);
    drawArrow(o, e, colors[i % colors.length], 2.4);
    label('u' + (i + 1), { x: e.x + 10, y: e.y - 10 }, colors[i % colors.length], 15, true);
  });
  ctx.beginPath(); ctx.arc(om.x, om.y, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#d4af37'; ctx.fill();
  label('v̄', { x: om.x + 14, y: om.y + 14 }, '#d4af37', 15, true);
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const a = 2 * Math.PI * i / 60;
    pts.push(project({ x: 1.4 * Math.cos(a), y: 1.4 * Math.sin(a), z: 0 }));
  }
  drawPoly(pts, null, 0, 'rgba(255,255,255,.12)');
  const waveR = 1.4 + Math.sin(t * 2) * 0.05;
  const pts2 = [];
  for (let i = 0; i <= 60; i++) {
    const a = 2 * Math.PI * i / 60;
    pts2.push(project({ x: waveR * Math.cos(a), y: waveR * Math.sin(a), z: 0 }));
  }
  drawPoly(pts2, null, 0, 'rgba(212,175,55,.35)');
}

function drawMainTheorem(params) {
  clearCanvas();
  const t = view.time;
  const colors = ['#e74c3c', '#3498db', '#2ecc71'];
  if (view.shapes.torus) {
    const torus = makeTorus(0.7, 0.25, 24, 14);
    drawMesh(torus, { ax: t * view.speed * 0.5 + 0.5, ay: t * view.speed * 0.8, az: 0, color: '#d4af37', alpha: 0.75 });
  }
  const step = 2 * Math.PI / 3;
  for (let s = 0; s < 3; s++) {
    const baseAng = s * step + t * view.speed * 0.3;
    const N = 50;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const ang = baseAng + u * Math.PI * 1.2;
      const rad = 1.0 + 0.3 * u;
      pts.push(project({ x: rad * Math.cos(ang), y: -0.6 + 1.2 * u, z: rad * Math.sin(ang) }));
    }
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = colors[s];
    ctx.lineWidth = 3;
    ctx.stroke();
    const pts2 = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const ang = baseAng + u * Math.PI * 1.2;
      const rad = 1.0 + 0.3 * u;
      pts2.push(project({ x: rad * Math.cos(ang), y: -0.6 + 1.2 * u + 0.15, z: rad * Math.sin(ang) }));
    }
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = pts[i], b = pts2[i];
      if (i === 0) { ctx.moveTo(a.x, a.y); }
      ctx.lineTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    }
    for (let i = N; i >= 0; i--) {
      ctx.lineTo(pts2[i].x, pts2[i].y);
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = colors[s];
    ctx.globalAlpha = 0.18;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawUniqueGames(params) {
  clearCanvas();
  const t = view.time;
  const W = view.W, H = view.H;
  const n = 7;
  const leftX = W * 0.25, rightX = W * 0.75;
  const topY = H * 0.2, botY = H * 0.8;

  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    left.push({ x: leftX, y: topY + (botY - topY) * i / (n - 1) });
    right.push({ x: rightX, y: topY + (botY - topY) * i / (n - 1) });
  }

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if ((i * 3 + j * 7) % 4 === 0 || (i === j)) {
        const isSat = (i + j + Math.floor(t * 2)) % 3 !== 0;
        ctx.beginPath();
        ctx.moveTo(left[i].x, left[i].y);
        ctx.lineTo(right[j].x, right[j].y);
        ctx.strokeStyle = isSat ? 'rgba(46,204,113,.55)' : 'rgba(231,76,60,.35)';
        ctx.lineWidth = isSat ? 1.6 : 1;
        ctx.stroke();
      }
    }
  }

  left.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
    ctx.fillStyle = '#2ecc71'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    label('v' + (i + 1), { x: p.x - 22, y: p.y }, '#e8ecf2', 12, true);
  });
  right.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
    ctx.fillStyle = '#e74c3c'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    label('w' + (i + 1), { x: p.x + 22, y: p.y }, '#e8ecf2', 12, true);
  });

  label('Complétude ≥ 1 − ε', { x: W / 2, y: H * 0.94 }, '#2ecc71', 14, true);
  label('Soundness ≤ δ', { x: W / 2, y: H * 0.97 }, '#e74c3c', 14, true);
  label('Théorème 6.3 — Unique Games input', { x: W / 2, y: 30 }, '#d4af37', 15, true);
}

function drawReduction(params) {
  clearCanvas();
  const t = view.time;
  const W = view.W, H = view.H;

  const steps = [
    { label: '3SAT', color: '#e74c3c', x: 0.10, y: 0.5 },
    { label: 'Unique Games', color: '#2ecc71', x: 0.30, y: 0.5 },
    { label: 'Matrice A', color: '#3498db', x: 0.50, y: 0.5 },
    { label: 'Clust(A|I_k)', color: '#9b59b6', x: 0.70, y: 0.5 },
    { label: 'θ', color: '#d4af37', x: 0.90, y: 0.5 }
  ];

  steps.forEach((s, i) => {
    const x = W * s.x, y = H * s.y;
    ctx.save();
    ctx.translate(x, y);
    const pulse = 1 + Math.sin(t * 2 + i) * 0.03;
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.roundRect(-55, -25, 110, 50, 8);
    ctx.fillStyle = 'rgba(18,22,28,.9)';
    ctx.fill();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.restore();
    label(s.label, { x, y }, s.color, 15, false);
  });

  for (let i = 0; i < steps.length - 1; i++) {
    const a = { x: W * steps[i].x + 55, y: H * steps[i].y };
    const b = { x: W * steps[i + 1].x - 55, y: H * steps[i + 1].y };
    drawArrow(a, b, '#d4af37', 2.2);
    const u = ((t * 0.5 + i * 0.2) % 1);
    const px = a.x + (b.x - a.x) * u;
    const py = a.y + (b.y - a.y) * u;
    ctx.beginPath(); ctx.arc(px, py, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#f1c40f'; ctx.fill();
  }

  const gx = W * 0.5, gy = H * 0.78;
  ctx.beginPath();
  ctx.moveTo(W * 0.25, gy);
  ctx.lineTo(W * 0.75, gy);
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W * 0.5, gy);
  ctx.lineTo(W * 0.5, gy + 30);
  ctx.stroke();
  label('S < H/α', { x: W * 0.5, y: gy + 46 }, '#e74c3c', 14, true);

  label('Théorème 6.1 — hardness gap', { x: W / 2, y: 30 }, '#d4af37', 15, true);
}

function drawCertificates(params) {
  clearCanvas();
  const t = view.time;

  const lx = W * 0.28, ly = H * 0.5;
  ctx.beginPath();
  ctx.arc(lx, ly, 60, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(212,175,55,.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  label('π ∈ (3.14159, 3.14160)', { x: lx, y: ly - 80 }, '#d4af37', 13, true);

  const bars = [
    { label: '√x', l: 0.3, u: 0.7 },
    { label: 'e^{-y}', l: 0.2, u: 0.8 },
    { label: 'Φ(x)', l: 0.25, u: 0.75 },
    { label: 'arcsin x', l: 0.35, u: 0.65 }
  ];
  const bx = W * 0.55, by = H * 0.25, bw = W * 0.3, bh = H * 0.5 / bars.length;
  bars.forEach((b, i) => {
    const y = by + i * bh;
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(bx, y, bw, bh - 8);
    ctx.fillStyle = 'rgba(212,175,55,.3)';
    ctx.fillRect(bx + bw * b.l, y, bw * (b.u - b.l), bh - 8);
    ctx.beginPath(); ctx.arc(bx + bw * b.l, y + (bh-8)/2, 4, 0, 2*Math.PI);
    ctx.fillStyle = '#2ecc71'; ctx.fill();
    ctx.beginPath(); ctx.arc(bx + bw * b.u, y + (bh-8)/2, 4, 0, 2*Math.PI);
    ctx.fillStyle = '#e74c3c'; ctx.fill();
    label(b.label, { x: bx - 30, y: y + (bh-8)/2 }, '#e8ecf2', 12, true);
  });

  const u = ((t * 0.4) % 1);
  const px = bx + bw * u;
  ctx.beginPath(); ctx.arc(px, by + 20, 4, 0, 2*Math.PI);
  ctx.fillStyle = '#f1c40f'; ctx.fill();

  label('Enceintes rationnelles', { x: W / 2, y: H * 0.9 }, '#d4af37', 14, true);
  label('Appendice A — certificats', { x: W / 2, y: 30 }, '#d4af37', 15, true);
}

   6. UI LOGIC
   ===================================================================== */
let currentScene = SCENES[0];
let currentParams = {};

function renderSceneList() {
  const ul = document.getElementById('scene-list');
  ul.innerHTML = '';
  SCENES.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="tag ${s.tag.toLowerCase()}">${s.tag}</span>${s.title}`;
    li.addEventListener('click', () => selectScene(i));
    if (s === currentScene) li.classList.add('active');
    ul.appendChild(li);
  });
}

function renderParams() {
  const box = document.getElementById('param-box');
  box.innerHTML = '';
  if (currentScene.params.length === 0) {
    box.innerHTML = '<div style="color:#666;font-style:italic;font-size:0.9rem;">Aucun paramètre.</div>';
    return;
  }
  currentScene.params.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';
    if (p.type === 'bool') {
      const btn = document.createElement('button');
      btn.textContent = (currentParams[p.key] ? '✓ ' : '✗ ') + p.label;
      btn.className = currentParams[p.key] ? 'on' : '';
      btn.style.cssText = 'width:100%;text-align:left;font-size:0.9rem;padding:8px 12px;border-radius:6px;border:1px solid var(--panel-border);background:' + (currentParams[p.key] ? 'var(--accent-purple)' : 'rgba(255,255,255,0.05)') + ';color:white;cursor:pointer;';
      btn.addEventListener('click', () => {
        currentParams[p.key] = !currentParams[p.key];
        renderParams();
        if (currentScene) currentScene.draw(currentParams);
      });
      div.appendChild(btn);
    } else {
      const lab = document.createElement('label');
      lab.innerHTML = `<span>${p.label}</span><span style="color:var(--accent-gold);">${currentParams[p.key]}</span>`;
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = p.min; inp.max = p.max; inp.step = p.step;
      inp.value = currentParams[p.key];
      inp.addEventListener('input', () => {
        currentParams[p.key] = parseFloat(inp.value);
        lab.querySelector('span:last-child').textContent = inp.value;
        if (currentScene) currentScene.draw(currentParams);
      });
      div.appendChild(lab);
      div.appendChild(inp);
    }
    box.appendChild(div);
  });
}

function renderShapeToggles() {
  const grid = document.getElementById('shape-grid');
  grid.innerHTML = '';
  const shapes = [
    { key: 'cube', name: 'Cube', color: '#ef4444' },

  ];

    lab.className = 'shape-toggle' + (view.shapes[s.key] ? ' on' : '');

function renderLegends() {
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  
  lBox.innerHTML = `<h4>${currentScene.legendLeft.title}</h4><ul>` + 
    currentScene.legendLeft.items.map(it => 
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendLeft.eq ? `<div class="eq" id="eq-left"></div>` : '');
    
  rBox.innerHTML = `<h4>${currentScene.legendRight.title}</h4><ul>` + 
    currentScene.legendRight.items.map(it => 
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendRight.eq ? `<div class="eq" id="eq-right"></div>` : '');

    if (currentScene.legendRight.eq) katex.render(currentScene.legendRight.eq, document.getElementById('eq-right'), {throwOnError: false});
  }
}

function selectScene(index) {
  currentScene = SCENES[index];
  currentParams = {};
  currentScene.params.forEach(p => currentParams[p.key] = p.value);
  
  document.getElementById('scene-title').textContent = currentScene.title;
  
  const eqEl = document.getElementById('scene-eq');
  if (window.katex) katex.render(currentScene.tex, eqEl, {throwOnError: false, displayMode: true});
  else eqEl.textContent = currentScene.tex;
  
  document.getElementById('description').innerHTML = currentScene.desc;
  
  renderSceneList();
  renderParams();
  renderLegends();
  
  view.yaw = 0.5; view.pitch = 0.3; view.zoom = 1;
  view.vyaw = 0; view.vpitch = 0;
}

/* =====================================================================
   7. BOUCLE & ÉVÉNEMENTS
   ===================================================================== */
let lastTime = performance.now();
function loop(now) {
  try {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    view.time += dt * view.speed;
    
    if (view.physics) {
      if (view.autoRotate) {
        view.vyaw += (0.15 - view.vyaw) * dt * 2;
      } else {
        view.vyaw *= Math.pow(view.damping, dt * 60);
        view.vpitch *= Math.pow(view.damping, dt * 60);
      }
      view.yaw += view.vyaw * dt;
      view.pitch += view.vpitch * dt;
    }
    
    if (view.W === 0) resizeCanvas();
    
    currentScene.draw(currentParams);
    drawParticles();
  } catch (e) {
    console.error("Erreur d'affichage :", e);
  }
  
  requestAnimationFrame(loop);
}

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  view.vyaw = 0; view.vpitch = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.yaw += dx * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch + dy * 0.005));
  view.vyaw = dx * 0.005 / 0.016;
  view.vpitch = dy * 0.005 / 0.016;
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.zoom = Math.max(0.3, Math.min(4, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

document.getElementById('damp').addEventListener('input', function () {
  view.damping = parseFloat(this.value);
  document.getElementById('damp-val').textContent = this.value;
});
document.getElementById('speed').addEventListener('input', function () {

  document.getElementById('speed-val').textContent = this.value;

document.getElementById('btn-auto').addEventListener('click', function () {

document.getElementById('btn-particles').addEventListener('click', function () {

document.getElementById('btn-panel').addEventListener('click', function () {

});

const recModal = document.getElementById('rec-modal');
let mediaRecorder = null, recordedChunks = [], recCanvas = null, recCtx = null, recRaf = null;

document.getElementById('btn-record').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('btn-panel').classList.remove('on');
  document.getElementById('stage').classList.remove('panel-open');
  setTimeout(() => { resizeCanvas(); resizeParticles(); }, 320);
  
  recModal.classList.add('show');
});
document.getElementById('btn-cancel-rec').addEventListener('click', () => {
  recModal.classList.remove('show');
});
document.getElementById('btn-start-rec').addEventListener('click', () => {
  recModal.classList.remove('show');
  startRecording(parseInt(document.getElementById('res-select').value));
});

function startRecording(resHeight) {
  const ratio = 16 / 9;
  const RH = resHeight;
  const RW = Math.round(RH * ratio);
  
  if (!recCanvas) { recCanvas = document.createElement('canvas'); recCtx = recCanvas.getContext('2d'); }
  recCanvas.width = RW; recCanvas.height = RH;
  
  const stream = recCanvas.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `gaussian-${currentScene.id}-${Date.now()}.webm`;
    a.click(); URL.revokeObjectURL(url);
  };
  mediaRecorder.start();
  
  const badge = document.getElementById('rec-badge');
  badge.classList.add('show');
  
  function recLoop() {
    buildRecordFrame(RW, RH);
    recRaf = requestAnimationFrame(recLoop);
  }
  recLoop();
  
  canvas.addEventListener('click', function stop() {
    if(mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      cancelAnimationFrame(recRaf);
      badge.classList.remove('show');
      canvas.removeEventListener('click', stop);
    }
  }, { once: true });
}

function buildRecordFrame(RW, RH) {
  recCtx.fillStyle = '#050508';
  recCtx.fillRect(0, 0, RW, RH);
  
  recCtx.fillStyle = '#e8e6f0';
  recCtx.font = `bold 56px "Times New Roman"`;
  recCtx.textAlign = 'center';
  recCtx.textBaseline = 'middle';
  recCtx.fillText(currentScene.title, RW/2, RH*0.1);
  
  const figH = RH * 0.55;
  const figW = RW * 0.8;
  const figX = RW * 0.1;
  const figY = RH * 0.18;
  
  recCtx.save();
  recCtx.beginPath();
  recCtx.rect(figX, figY, figW, figH);
  recCtx.clip();
  recCtx.drawImage(canvas, figX, figY, figW, figH);
  recCtx.restore();
  
  const descY = RH * 0.76;
  recCtx.fillStyle = '#111';
  recCtx.fillRect(RW * 0.1, descY, RW * 0.8, RH * 0.18);
  
  recCtx.fillStyle = '#fff';
  recCtx.font = `28px "Times New Roman"`;
  const words = currentScene.desc.replace(/<[^>]+>/g, '').split(' ');
  let line = '';
  let y = descY + 35;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (recCtx.measureText(test).width > RW * 0.75 && i > 0) {
      recCtx.fillText(line, RW * 0.15, y);
      line = words[i] + ' ';
      y += 36;
    } else {
      line = test;
    }
  }
  recCtx.fillText(line, RW * 0.15, y);
}

/* =====================================================================
   9. BOOT
   ===================================================================== */
function boot() {
  resizeCanvas();
  resizeParticles();
  renderShapeToggles();
  selectScene(0);
  requestAnimationFrame(loop);
}

if (window.katex) boot();
else window.addEventListener('load', boot);
</script>
