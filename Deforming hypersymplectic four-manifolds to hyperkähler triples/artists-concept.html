{ "imports": {

<style>

  #cinePanel { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 10; background: rgba(10,15,22,.95); backdrop-filter: blur(14px); border-left: 1px solid rgba(88,166,255,.2); padding: 24px 20px; overflow-y: auto; font-size: .85rem; }
  #cinePanel h5 { margin: 0 0 12px; font-size: .75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
  #cinePanel .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; color: var(--muted); }

  #cinePanel input[type=range] { width: 100%; accent-color: #58a6ff; cursor: pointer; margin-bottom: 16px; }

  @media(max-width: 1000px) {

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   INITIALISATION THREE.JS
   ============================================================ */
const canvas = document.getElementById('cinemaCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.02);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
camera.position.set(6, 5, 9);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.5;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.enableZoom = false;
controls.minDistance = 3;
controls.maxDistance = 30;

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
keyLight.position.set(5, 10, 7);
scene.add(keyLight);
const fillLight = new THREE.PointLight(0x58a6ff, 1.0, 40);
fillLight.position.set(-5, -2, 5);
scene.add(fillLight);
const rimLight = new THREE.PointLight(0xff9f43, 0.8, 40);
rimLight.position.set(0, -6, -5);
scene.add(rimLight);

function resizeRenderer() {
  const w = window.innerWidth - (window.innerWidth > 1000 ? 340 : 260);
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);
resizeRenderer();

/* ============================================================
   ZOOM PAR PALIERS (MOLETTE)
   ============================================================ */
const ZOOM_STEP = 0.8;
let zoomLock = false;

function applyZoom(direction) {
  const dir = camera.position.clone().sub(controls.target);
  const d = dir.length();
  const nd = Math.max(controls.minDistance, Math.min(controls.maxDistance, d + direction * ZOOM_STEP));
  if (Math.abs(nd - d) < 1e-4) return;
  camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(nd));
  syncZoomUI();
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (zoomLock) return;
  zoomLock = true;
  applyZoom(e.deltaY > 0 ? +1 : -1);
  setTimeout(() => { zoomLock = false; }, 80);
}, { passive: false });

function syncZoomUI() {
  const d = camera.position.distanceTo(controls.target);
  const pZoom = document.getElementById('pZoom');
  const pZoomInput = document.getElementById('pZoomInput');
  if (pZoom) pZoom.textContent = d.toFixed(1);
  if (pZoomInput) pZoomInput.value = d.toFixed(1);
}

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
const state = {
  view: 'artist',
  wireframe: false,
  autoRotate: true,
};

let currentGroup = null;
let tickFns = [];

/* Refs vue artiste */
let manifoldRef = null, manifoldWireRef = null, hkGroupRef = null;
let morphEnabledArtist = true, showSpheres = true;

/* Refs vue formes */
let fieldI, fieldJ, fieldK;

/* Refs vue morphing (GPU) */
let morphMesh = null, morphWire = null, morphMaterial = null;
let morphT = 0, morphDir = 1, morphAuto = true;
let morphUniforms = null;

/* Refs vue hyperkähler finale */
let hyperManifold = null, hyperWire = null;
let hyperFieldsGroup = null;
let hyperParallelGroup = null;
let hkIntensity = 0.8;
let hkShowParallel = true, hkShowFields = true;

/* ============================================================
   NETTOYAGE
   ============================================================ */
function disposeGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  scene.remove(g);
}

function resetRefs() {
  manifoldRef = manifoldWireRef = hkGroupRef = null;
  fieldI = fieldJ = fieldK = null;
  morphMesh = morphWire = morphMaterial = null;
  morphUniforms = null;
  hyperManifold = hyperWire = null;
  hyperFieldsGroup = null;
  hyperParallelGroup = null;
  tickFns = [];
}

/* ============================================================
   VUE 1 : VUE D'ARTISTE (K3 & TRANSPORT)
   ============================================================ */
function buildArtistScene() {
  const g = new THREE.Group();
  scene.add(g);
  currentGroup = g;

  const torusGeo = new THREE.TorusKnotGeometry(2.0, 0.55, 160, 20, 2, 3);
  const manifoldMat = new THREE.MeshPhysicalMaterial({
    color: 0x4ecdc4, metalness: 0.7, roughness: 0.3,
    emissive: 0x2a7f78, emissiveIntensity: 0.5,
    clearcoat: 1, clearcoatRoughness: 0.1,
    transparent: true, opacity: 1.0
  });
  manifoldRef = new THREE.Mesh(torusGeo, manifoldMat);
  g.add(manifoldRef);

  const wireMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, wireframe: true, transparent: true, opacity: 0.0, visible: false
  });
  manifoldWireRef = new THREE.Mesh(new THREE.TorusKnotGeometry(2.0, 0.55, 160, 12, 2, 3), wireMat);
  g.add(manifoldWireRef);

  const hkGroup = new THREE.Group();
  hkGroupRef = hkGroup;
  const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d];
  colors.forEach((c, i) => {
    const sphMat = new THREE.MeshStandardMaterial({
      color: c, emissive: c, emissiveIntensity: 0.6,
      transparent: true, opacity: 0.3, wireframe: true
    });
    const sph = new THREE.Mesh(new THREE.SphereGeometry(1.5 + i * 0.4, 24, 16), sphMat);
    hkGroup.add(sph);

    const dirs = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    const dir = dirs[i];
    [dir, dir.clone().negate()].forEach(d => {
      const ar = new THREE.ArrowHelper(d, new THREE.Vector3(0,0,0), 3.5, c, 0.4, 0.2);
      ar.line.material.transparent = true;
      ar.line.material.opacity = 0.9;
      ar.cone.material.transparent = true;
      ar.cone.material.opacity = 0.9;
      hkGroup.add(ar);
    });
  });
  g.add(hkGroup);

  const geoPts = [];
  const N = 300;
  for (let i = 0; i < N; i++) {
    const u = (i / N) * Math.PI * 2 * 2;
    const R = 2.0, r = 0.55, p = 2, q = 3;
    const cq = Math.cos(q * u / p), sq = Math.sin(q * u / p);
    const cu = Math.cos(u), su = Math.sin(u);
    geoPts.push(new THREE.Vector3((R + r * cq) * cu, (R + r * cq) * su, r * sq));
  }
  const geoCurve = new THREE.CatmullRomCurve3(geoPts);
  const geoTorus = new THREE.Mesh(
    new THREE.TubeGeometry(geoCurve, 300, 0.04, 6, true),
    new THREE.MeshBasicMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.8 })
  );
  g.add(geoTorus);

  const traveler = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 })
  );
  g.add(traveler);

  const PAR_N = 16;
  const parallelArrows = [];
  for (let i = 0; i < PAR_N; i++) {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.3, 10),
      new THREE.MeshStandardMaterial({ color: 0xff9f43, emissive: 0xff9f43, emissiveIntensity: 1.0 })
    );
    parallelArrows.push(cone);
    g.add(cone);
  }

  const refVec = new THREE.Vector3(0, 0, 1);
  let morph = 0, morphDirA = 1;

  tickFns.push((t, dt) => {
    if (morphEnabledArtist) {
      morph += morphDirA * dt * 0.4;
      if (morph > 1) { morph = 1; morphDirA = -1; }
      if (morph < 0) { morph = 0; morphDirA = 1; }
    }
    if (manifoldRef) {
      manifoldRef.material.opacity = 1 - 0.7 * morph;
      manifoldRef.material.emissiveIntensity = 0.5 + 0.3 * morph;
    }
    if (manifoldWireRef) {
      manifoldWireRef.material.opacity = state.wireframe ? (0.1 + 0.15 * morph) : 0.0;
    }
    if (hkGroupRef) {
      hkGroupRef.children.forEach(child => {
        if (child.isMesh && child.geometry.type === 'SphereGeometry') {
          child.visible = showSpheres;
          child.scale.setScalar(1 + 0.15 * morph);
        }
      });
    }
    geoTorus.material.opacity = 0.4 + 0.5 * morph;

    const u = ((t * 0.15) % 1);
    traveler.position.copy(geoCurve.getPoint(u));
    for (let i = 0; i < PAR_N; i++) {
      const uu = (u + i / PAR_N) % 1;
      const p = geoCurve.getPoint(uu);
      const tan = geoCurve.getTangent(uu).normalize();
      const ar = parallelArrows[i];
      ar.position.copy(p);
      const v = refVec.clone().sub(tan.clone().multiplyScalar(refVec.dot(tan)));
      if (v.lengthSq() < 1e-4) v.set(0, 1, 0);
      v.normalize();
      ar.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v);
    }
  });
}

/* ============================================================
   VUE 2 : 3 FORMES SÉPARÉES
   ============================================================ */
const A_PARAM = 2.0;

function createQuaternionicField(colorHex, axis) {
  const points = [];
  const N = 240;
  const radius = A_PARAM + 0.6;
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * Math.PI * 4;
    let x, y, z;
    if (axis === 'I') { x = t * 0.1; y = radius * Math.cos(t); z = radius * Math.sin(t); }
    else if (axis === 'J') { x = radius * Math.cos(t); y = t * 0.1; z = radius * Math.sin(t); }
    else { x = radius * Math.cos(t); y = radius * Math.sin(t); z = t * 0.1; }
    points.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 160, 0.05, 10, false);
  const mat = new THREE.MeshStandardMaterial({
    color: colorHex, emissive: colorHex, emissiveIntensity: 0.75,
    metalness: 0.5, roughness: 0.2
  });
  return new THREE.Mesh(tubeGeo, mat);
}

function buildFormsScene() {
  const g = new THREE.Group();
  scene.add(g);
  currentGroup = g;

  fieldI = createQuaternionicField(0xff4d4d, 'I');
  fieldJ = createQuaternionicField(0x4dff88, 'J');
  fieldK = createQuaternionicField(0x4d8bff, 'K');
  g.add(fieldI, fieldJ, fieldK);

  const makeAnchor = (color) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 12, 12),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1 })
    );
    return m;
  };
  g.add(makeAnchor(0xff4d4d), makeAnchor(0x4dff88), makeAnchor(0x4d8bff));

  tickFns.push((t, dt) => {
    fieldI.rotation.x += dt * 0.4;
    fieldJ.rotation.y += dt * 0.4;
    fieldK.rotation.z += dt * 0.4;
  });
}

/* ============================================================
   VUE 3 : MORPHING UNIVARIÉ (GPU)
   ============================================================ */
const R_MIN = A_PARAM + 0.05;
const R_MAX = 7.0;
const stepsR = 24, stepsTheta = 28, stepsPhi = 28;

function buildMorphScene() {
  const g = new THREE.Group();
  scene.add(g);
  currentGroup = g;

  const vertexCount = (stepsR + 1) * (stepsTheta + 1) * (stepsPhi + 1);
  const positions = new Float32Array(vertexCount * 3);
  const colors = new Float32Array(vertexCount * 3);
  const indices = [];

  let vIdx = 0;
  for (let i = 0; i <= stepsR; i++) {
    const r = R_MIN + (i / stepsR) * (R_MAX - R_MIN);
    const f = 1.0 - Math.pow(A_PARAM / r, 4);
    const curvature = 12.0 * Math.pow(A_PARAM, 4) / Math.pow(r, 6);
    const tC = Math.min(1.0, curvature / 1.5);
    const cr = tC, cg = 0.15, cb = 1.0 - tC;
    for (let j = 0; j <= stepsTheta; j++) {
      const theta = (j / stepsTheta) * Math.PI;
      for (let k = 0; k <= stepsPhi; k++) {
        const phi = (k / stepsPhi) * Math.PI * 2;
        const x = r * Math.sin(theta) * Math.cos(phi);
        const y = r * Math.cos(theta);
        const z = r * Math.sin(theta) * Math.sin(phi) * Math.sqrt(Math.max(0.01, f));
        positions[vIdx*3] = x; positions[vIdx*3+1] = y; positions[vIdx*3+2] = z;
        colors[vIdx*3] = cr; colors[vIdx*3+1] = cg; colors[vIdx*3+2] = cb;
        vIdx++;
      }
    }
  }

  const strideTheta = stepsPhi + 1;
  const strideR = (stepsTheta + 1) * strideTheta;
  for (let i = 0; i < stepsR; i++) {
    for (let j = 0; j < stepsTheta; j++) {
      for (let k = 0; k < stepsPhi; k++) {
        const a = i * strideR + j * strideTheta + k;
        const b = a + 1;
        const c = a + strideTheta;
        const d = c + 1;
        const e = a + strideR;
        const f = e + 1;
        const gg = e + strideTheta;
        const h = gg + 1;
        indices.push(a, c, b, b, c, d);
        indices.push(e, f, gg, f, h, gg);
        indices.push(a, b, e, b, f, e);
        indices.push(c, gg, d, d, gg, h);
      }
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  morphUniforms = { uT: { value: 0.0 } };

  morphMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true, metalness: 0.6, roughness: 0.28,
    side: THREE.DoubleSide, flatShading: false,
  });

  const deformSnippet = `
    uniform float uT;
    vec3 deform(vec3 p) {
      float seg = uT * 3.0;
      float i0 = floor(min(seg, 2.999));
      float local = seg - i0;
      float wI = sin(p.x * 2.0) * 0.18;
      float wJ = cos(p.y * 2.0) * 0.18;
      float wK = sin(p.z * 2.0) * 0.18;
      float wX = 0.0;
      float w0 = 0.0, w1 = 0.0;
      vec3 d0, d1;
      if (i0 < 0.5)      { w0 = wI; w1 = wJ; d0 = vec3(1,0,0); d1 = vec3(0,1,0); }
      else if (i0 < 1.5) { w0 = wJ; w1 = wK; d0 = vec3(0,1,0); d1 = vec3(0,0,1); }
      else               { w0 = wK; w1 = wX; d0 = vec3(0,0,1); d1 = vec3(0,0,0); }
      float w = mix(w0, w1, local);
      vec3  b = mix(d0, d1, local);
      return p + b * w;
    }
  `;

  morphMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.uT = morphUniforms.uT;
    shader.vertexShader = deformSnippet + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `vec3 transformed = deform(position);`
    );
  };

  morphMesh = new THREE.Mesh(geometry, morphMaterial);
  g.add(morphMesh);

  const wireMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, wireframe: true, transparent: true, opacity: 0.0, visible: false
  });
  wireMat.onBeforeCompile = (shader) => {
    shader.uniforms.uT = morphUniforms.uT;
    shader.vertexShader = deformSnippet + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `vec3 transformed = deform(position);`
    );
  };
  morphWire = new THREE.Mesh(geometry, wireMat);
  g.add(morphWire);

  morphT = 0; morphDir = 1;

  tickFns.push((t, dt) => {
    if (morphAuto) {
      morphT += morphDir * dt * 0.9;
      if (morphT >= 1) { morphT = 1; morphDir = -1; }
      if (morphT <= 0) { morphT = 0; morphDir = 1; }
      const slider = document.getElementById('morphSlider');
      if (slider) slider.value = morphT;
      updateMorphUI();
    } else {
      morphMesh.rotation.y += dt * 0.15;
      morphWire.rotation.y += dt * 0.15;
    }
    morphUniforms.uT.value = morphT;
  });
}

function updateMorphUI() {
  const labels = ['I', 'J', 'K', 'X⁴'];
  const idx = Math.min(3, Math.floor(morphT * 4));
  const next = Math.min(3, idx + 1);
  const tValueEl = document.getElementById('tValue');
  const morphStateEl = document.getElementById('morphState');
  if (tValueEl) tValueEl.textContent = morphT.toFixed(3);
  if (morphStateEl) morphStateEl.textContent = `${labels[idx]} → ${labels[next]}`;
  refreshLegend();
}

/* ============================================================
   VUE 4 : VARIÉTÉ HYPERKÄHLER FINALE
   ------------------------------------------------------------
   La triade I, J, K agit SIMULTANÉMENT et de façon parallèle
   sur le manifold X⁴ : le fibré tangent est couvert par les
   trois structures, chacune préservant la métrique.
   Visualisation : 3 champs de vecteurs colorés + ∇ω = 0
   (flèches identiques après transport le long de la géodésique)
   ============================================================ */
function buildHyperScene() {
  const g = new THREE.Group();
  scene.add(g);
  currentGroup = g;

  // --- Manifold X⁴ central (Eguchi-Hanson stylisé) ---
  const torusGeo = new THREE.TorusKnotGeometry(1.9, 0.5, 140, 18, 2, 3);
  const manifoldMat = new THREE.MeshPhysicalMaterial({
    color: 0x4ecdc4, metalness: 0.75, roughness: 0.25,
    emissive: 0x1f5e57, emissiveIntensity: 0.55,
    clearcoat: 1, clearcoatRoughness: 0.15,
    transparent: true, opacity: 0.92
  });
  hyperManifold = new THREE.Mesh(torusGeo, manifoldMat);
  g.add(hyperManifold);

  const wireMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, wireframe: true, transparent: true, opacity: 0.0, visible: false
  });
  hyperWire = new THREE.Mesh(new THREE.TorusKnotGeometry(1.9, 0.5, 140, 10, 2, 3), wireMat);
  g.add(hyperWire);

  // --- Triade I, J, K : champs de vecteurs orthogonaux parallèles ---
  const fieldsGroup = new THREE.Group();
  hyperFieldsGroup = fieldsGroup;
  const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d];
  const dirs = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];

  colors.forEach((c, i) => {
    // Sphère filaire de rayon croissant
    const sphMat = new THREE.MeshBasicMaterial({
      color: c, wireframe: true, transparent: true, opacity: 0.18
    });
    const sph = new THREE.Mesh(new THREE.SphereGeometry(2.2 + i * 0.35, 20, 14), sphMat);
    fieldsGroup.add(sph);

    // Deux flèches opposées = direction de la structure complexe
    const dir = dirs[i];
    [dir, dir.clone().negate()].forEach(d => {
      const ar = new THREE.ArrowHelper(d, new THREE.Vector3(0,0,0), 3.2, c, 0.35, 0.18);
      ar.line.material.transparent = true;
      ar.line.material.opacity = 0.85;
      ar.cone.material.transparent = true;
      ar.cone.material.opacity = 0.85;
      fieldsGroup.add(ar);
    });
  });
  g.add(fieldsGroup);

  // --- Transport parallèle ∇ω = 0 : anneaux → flèches toujours identiques ---
  const parallelGroup = new THREE.Group();
  hyperParallelGroup = parallelGroup;

  const geoPts = [];
  const N = 300;
  for (let i = 0; i < N; i++) {
    const u = (i / N) * Math.PI * 2 * 2;
    const R = 1.9, r = 0.5, p = 2, q = 3;
    const cq = Math.cos(q * u / p), sq = Math.sin(q * u / p);
    const cu = Math.cos(u), su = Math.sin(u);
    geoPts.push(new THREE.Vector3((R + r * cq) * cu, (R + r * cq) * su, r * sq));
  }
  const geoCurve = new THREE.CatmullRomCurve3(geoPts);
  const geoTorus = new THREE.Mesh(
    new THREE.TubeGeometry(geoCurve, 300, 0.035, 6, true),
    new THREE.MeshBasicMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.85 })
  );
  parallelGroup.add(geoTorus);

  const traveler = new THREE.Mesh(
    new THREE.SphereGeometry(0.11, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 })
  );
  parallelGroup.add(traveler);

  const PAR_N = 20;
  const parallelArrows = [];
  for (let i = 0; i < PAR_N; i++) {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.09, 0.28, 10),
      new THREE.MeshStandardMaterial({ color: 0xff9f43, emissive: 0xff9f43, emissiveIntensity: 1.0 })
    );
    parallelArrows.push(cone);
    parallelGroup.add(cone);
  }
  g.add(parallelGroup);

  const refVec = new THREE.Vector3(0, 0, 1);

  // Animation
  tickFns.push((t, dt) => {
    // Rotation lente de la triade (pour montrer leur orthogonalité)
    if (hyperFieldsGroup) {
      hyperFieldsGroup.rotation.x += dt * 0.05;
      hyperFieldsGroup.rotation.y += dt * 0.05;
      hyperFieldsGroup.visible = hkShowFields;
      // Intensité : scale des sphères
      hyperFieldsGroup.children.forEach(child => {
        if (child.isMesh && child.geometry.type === 'SphereGeometry') {
          const base = 1 + 0.15 * Math.sin(t * 0.5);
          child.scale.setScalar(base * (0.7 + 0.4 * hkIntensity));
          child.material.opacity = 0.10 + 0.15 * hkIntensity;
        }
      });
    }
    // Manifold pulse
    if (hyperManifold) {
      hyperManifold.rotation.y += dt * 0.08;
      hyperManifold.material.emissiveIntensity = 0.4 + 0.3 * hkIntensity + 0.1 * Math.sin(t * 1.2);
    }
    if (hyperWire) {
      hyperWire.rotation.y += dt * 0.08;
      hyperWire.material.opacity = state.wireframe ? (0.35 + 0.15 * hkIntensity) : 0.0;
    }
    // Transport parallèle
    if (hyperParallelGroup) {
      hyperParallelGroup.visible = hkShowParallel;
      if (hkShowParallel) {
        const u = ((t * 0.18) % 1);
        traveler.position.copy(geoCurve.getPoint(u));
        for (let i = 0; i < PAR_N; i++) {
          const uu = (u + i / PAR_N) % 1;
          const p = geoCurve.getPoint(uu);
          const tan = geoCurve.getTangent(uu).normalize();
          const ar = parallelArrows[i];
          ar.position.copy(p);
          const v = refVec.clone().sub(tan.clone().multiplyScalar(refVec.dot(tan)));
          if (v.lengthSq() < 1e-4) v.set(0, 1, 0);
          v.normalize();
          ar.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v);
        }
      }
    }
  });
}

function refreshLegend() {
  if (state.view === 'morph') {
    const labels = ['I', 'J', 'K', 'X⁴'];
    const idx = Math.min(3, Math.floor(morphT * 4));
    const next = Math.min(3, idx + 1);
    document.getElementById('cineLeft').innerHTML = `
      <div class="cine-legend-col">
        <h4>Morphing Univarié</h4>
        <ul>
          <li><span class="dot" style="background:#58a6ff;color:#58a6ff"></span><span>Courant : <b>${labels[idx]}</b></span></li>
          <li><span class="dot" style="background:#ff9f43;color:#ff9f43"></span><span>Cible : <b>${labels[next]}</b></span></li>
        </ul>
        <div class="formula">t = ${morphT.toFixed(3)}</div>
      </div>`;
    document.getElementById('cineRight').innerHTML = LEGENDS.morph.right;
  } else {
    const l = LEGENDS[state.view];
    document.getElementById('cineLeft').innerHTML = l.left;
    document.getElementById('cineRight').innerHTML = l.right;
  }
}

function switchView(view) {
  state.view = view;
  artistSelect.value = view;

  if (currentGroup) { disposeGroup(currentGroup); currentGroup = null; }
  resetRefs();

  panelArtist.classList.toggle('visible', view === 'artist');
  panelMorph.classList.toggle('visible', view === 'morph');
  panelHyper.classList.toggle('visible', view === 'hyper');

  if (view === 'artist') buildArtistScene();
  else if (view === 'forms') buildFormsScene();
  else if (view === 'morph') buildMorphScene();
  else if (view === 'hyper') buildHyperScene();

  applyWireframe();

  const l = LEGENDS[view];
  document.getElementById('cineTitleText').textContent = l.title;
  document.getElementById('cineStep').textContent = l.step;
  document.getElementById('cineDesc').innerHTML = l.desc;

  refreshLegend();

  // Recalage caméra par vue (évite le bug de distance résiduelle)
  const dir = camera.position.clone().sub(controls.target).normalize();
  let targetDist;
  if (view === 'morph') targetDist = 18;      // dézoom 50 % + vue large
  else if (view === 'hyper') targetDist = 9;  // cadre serré sur le manifold
  else if (view === 'forms') targetDist = 7;  // 3 courbes proches
  else targetDist = 8;                        // artist
  targetDist = Math.max(controls.minDistance, Math.min(controls.maxDistance, targetDist));
  camera.position.copy(controls.target).add(dir.multiplyScalar(targetDist));
  syncZoomUI();

  controls.autoRotate = (view === 'forms') && state.autoRotate;
}

function applyWireframe() {
  const on = state.wireframe;
  const dot = btnWireframe.querySelector('.dot');
  if (dot) dot.classList.toggle('off', !on);
  btnWireframe.classList.toggle('active', on);

  if (state.view === 'artist' && manifoldWireRef) {
    manifoldWireRef.material.visible = on;
    manifoldWireRef.material.opacity = on ? 0.5 : 0.0;
  }
  if (state.view === 'morph' && morphWire) {
    morphWire.material.visible = on;
    morphWire.material.opacity = on ? 0.35 : 0.0;
  }
  if (state.view === 'hyper' && hyperWire) {
    hyperWire.material.visible = on;
    hyperWire.material.opacity = on ? 0.4 : 0.0;
  }
}

artistSelect.addEventListener('change', (e) => switchView(e.target.value));

btnWireframe.addEventListener('click', () => {
  state.wireframe = !state.wireframe;
  applyWireframe();
});

morphSlider.addEventListener('input', (e) => {
  morphT = parseFloat(e.target.value);
  morphAuto = false;
  if (morphAutoCb) morphAutoCb.checked = false;
  if (morphUniforms) morphUniforms.uT.value = morphT;
  updateMorphUI();
});

if (morphAutoCb) {
  morphAutoCb.addEventListener('change', (e) => {
    morphAuto = e.target.checked;
    if (morphAuto) morphDir = (morphT >= 1) ? -1 : 1;
  });
}

const pRotInput = document.getElementById('pRotInput');
const pZoomInput = document.getElementById('pZoomInput');
const pAuto = document.getElementById('pAuto');

pRotInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  document.getElementById('pRot').textContent = v.toFixed(2);
  controls.autoRotateSpeed = v;
});

pZoomInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).add(dir.multiplyScalar(v));
  syncZoomUI();
});

pAuto.addEventListener('change', (e) => {
  state.autoRotate = e.target.checked;
  controls.autoRotate = (state.view === 'forms') && state.autoRotate;
});

const pOpacityInput = document.getElementById('pOpacityInput');
const pMorph = document.getElementById('pMorph');
const pShowSpheres = document.getElementById('pShowSpheres');

pOpacityInput.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  document.getElementById('pOpacity').textContent = v.toFixed(2);
  if (hkGroupRef) {
    hkGroupRef.children.forEach(child => {
      if (child.isMesh && child.geometry.type === 'SphereGeometry') {
        child.material.opacity = v;
      }
    });
  }
});

pMorph.addEventListener('change', (e) => { morphEnabledArtist = e.target.checked; });
pShowSpheres.addEventListener('change', (e) => { showSpheres = e.target.checked; });

/* Contrôles vue hyperkähler */
const pHkIntensityInput = document.getElementById('pHkIntensityInput');
const pShowParallel = document.getElementById('pShowParallel');
const pShowFields = document.getElementById('pShowFields');

if (pHkIntensityInput) {
  pHkIntensityInput.addEventListener('input', (e) => {
    hkIntensity = parseFloat(e.target.value);
    document.getElementById('pHkIntensity').textContent = hkIntensity.toFixed(2);
  });
}
if (pShowParallel) {
  pShowParallel.addEventListener('change', (e) => { hkShowParallel = e.target.checked; });
}
if (pShowFields) {
  pShowFields.addEventListener('change', (e) => { hkShowFields = e.target.checked; });
}

/* ============================================================
   BOUCLE D'ANIMATION
   ============================================================ */
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  const t = now * 0.001;

  controls.update();
  tickFns.forEach(fn => fn(t, dt));
  renderer.render(scene, camera);
  syncZoomUI();
}

/* ============================================================
   LANCEMENT
   ============================================================ */
syncZoomUI();
switchView('artist');
animate();
