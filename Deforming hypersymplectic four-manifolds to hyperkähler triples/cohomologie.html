<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohomologie 3D - Deux séries (gauche/droite)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        .legende {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(20, 20, 30, 0.8);
            color: #eee;
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border-left: 6px solid #ff3366;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
        }
        .legende span.gauche { color: #ffaa00; font-weight: bold; }
        .legende span.droite { color: #00ccff; font-weight: bold; }
        .legende .surface { color: #aaa; font-style: italic; }
    </style>
</head>
<body>
    <div id="info">🧬 Cohomologie 3D – Séries gauche & droite sur surface</div>
    <div class="legende">
        <div>🟠 Série <span class="gauche">gauche</span> (x négatif)</div>
        <div>🔵 Série <span class="droite">droite</span> (x positif)</div>
        <div class="surface">⚪ Surface de cohomologie (grille ondulée)</div>
    </div>

    <!-- Importation de Three.js et OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Initialisation de la scène ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // fond sombre bleuté

        // --- Caméra ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 5, 12);
        camera.lookAt(0, 0, 0);

        // --- Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // ombres douces
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Contrôles Orbitaux ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.target.set(0, 0.5, 0);
        controls.maxPolarAngle = Math.PI / 2.2; // éviter de passer sous le sol

        // --- Lumières ---
        // Lumière ambiante
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Lumière directionnelle principale (avec ombres)
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 15;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 2;
        dirLight.shadow.camera.far = 30;
        scene.add(dirLight);

        // Lumière d'appoint colorée pour l'ambiance
        const lightLeft = new THREE.PointLight(0xffaa00, 0.5);
        lightLeft.position.set(-5, 3, 4);
        scene.add(lightLeft);
        const lightRight = new THREE.PointLight(0x00ccff, 0.5);
        lightRight.position.set(5, 3, 4);
        scene.add(lightRight);

        // --- Étoiles de fond (facultatif) ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starsPositions[i] = (Math.random() - 0.5) * 200;
            starsPositions[i+1] = (Math.random() - 0.5) * 200;
            starsPositions[i+2] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- Surface de cohomologie (grille ondulée) ---
        // Création d'une surface paramétrique: une grille avec une ondulation en fonction de x et z
        const width = 8;
        const depth = 6;
        const segmentsX = 40;
        const segmentsZ = 30;
        
        const surfaceGeometry = new THREE.BufferGeometry();
        const vertices = [];
        const indices = [];
        const normals = [];
        const colors = [];

        // Couleurs de base pour la surface (dégradé)
        const colorBase1 = new THREE.Color(0x2a2a4a);
        const colorBase2 = new THREE.Color(0x4a2a4a);
        
        // Génération des sommets
        for (let i = 0; i <= segmentsX; i++) {
            const x = (i / segmentsX - 0.5) * width;
            for (let j = 0; j <= segmentsZ; j++) {
                const z = (j / segmentsZ - 0.5) * depth;
                // Fonction d'ondulation: y = sin(x*1.5) * cos(z*1.2) * 0.6 + 0.3 * sin(x*2.5) * sin(z*2.0)
                // Un peu de bruit pour donner un aspect "cohomologique"
                const y = Math.sin(x * 1.8) * Math.cos(z * 1.5) * 0.7 
                          + Math.sin(x * 3.0) * 0.3 
                          + Math.cos(z * 2.2) * 0.3;
                
                vertices.push(x, y, z);
                
                // Couleur en fonction de la position et de la hauteur
                const mixFactor = (x + width/2) / width; // 0 à 1 de gauche à droite
                const color = colorBase1.clone().lerp(colorBase2, mixFactor);
                // Éclaircir en fonction de la hauteur
                const bright = (y + 0.8) * 0.6;
                color.multiplyScalar(1.0 + bright * 0.5);
                colors.push(color.r, color.g, color.b);
                
                // Normales approximatives (seront recalculées)
                normals.push(0, 1, 0);
            }
        }

        // Génération des indices (deux triangles par quadrilatère)
        for (let i = 0; i < segmentsX; i++) {
            for (let j = 0; j < segmentsZ; j++) {
                const a = i * (segmentsZ + 1) + j;
                const b = i * (segmentsZ + 1) + j + 1;
                const c = (i + 1) * (segmentsZ + 1) + j;
                const d = (i + 1) * (segmentsZ + 1) + j + 1;

                // Triangle 1 : a-b-c
                indices.push(a, b, c);
                // Triangle 2 : b-d-c
                indices.push(b, d, c);
            }
        }

        surfaceGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        surfaceGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        surfaceGeometry.setIndex(indices);
        surfaceGeometry.computeVertexNormals(); // normales correctes pour l'éclairage

        const surfaceMaterial = new THREE.MeshStandardMaterial({
            vertexColors: true,
            side: THREE.DoubleSide,
            emissive: new THREE.Color(0x111122),
            roughness: 0.5,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85,
            wireframe: false
        });

        const surface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
        surface.receiveShadow = true;
        surface.castShadow = true;
        scene.add(surface);

        // Ajout d'une grille fine par-dessus pour accentuer l'aspect "cohomologie"
        const wireframeMaterial = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
            emissive: new THREE.Color(0x224488)
        });
        const wireframeSurface = new THREE.Mesh(surfaceGeometry, wireframeMaterial);
        scene.add(wireframeSurface);

        // --- Séries de points : gauche (x négatif) et droite (x positif) ---
        // Les points suivent la surface avec un décalage vertical pour être visibles
        // On utilise une fonction différente pour chaque côté, mais en respectant la surface.
        
        // Paramètres
        const numPoints = 50; // par côté
        const leftPoints = [];
        const rightPoints = [];

        // Couleurs
        const leftColor = new THREE.Color(0xffaa00); // orange
        const rightColor = new THREE.Color(0x00ccff); // bleu cyan

        // Génération des positions pour les deux séries
        // On va de x = -3 à -0.2 pour la gauche, et x = 0.2 à 3 pour la droite
        // z varie de -2.5 à 2.5
        // La hauteur y est celle de la surface + un petit offset pour que les points flottent légèrement au-dessus
        // Pour la surface, on recalcule la même fonction y = f(x,z)
        function surfaceY(x, z) {
            return Math.sin(x * 1.8) * Math.cos(z * 1.5) * 0.7 
                   + Math.sin(x * 3.0) * 0.3 
                   + Math.cos(z * 2.2) * 0.3;
        }

        // Série gauche (x négatif)
        for (let i = 0; i < numPoints; i++) {
            // paramètre t de 0 à 1
            const t = i / (numPoints - 1);
            // x de -3.5 à -0.3
            const x = -3.5 + t * 3.2;
            // z varie sinusoïdalement pour créer une courbe
            const z = Math.sin(t * Math.PI * 2) * 2.0;
            // y de la surface + offset
            const y = surfaceY(x, z) + 0.25; // offset pour être au-dessus
            leftPoints.push(new THREE.Vector3(x, y, z));
        }

        // Série droite (x positif)
        for (let i = 0; i < numPoints; i++) {
            const t = i / (numPoints - 1);
            // x de 0.3 à 3.5
            const x = 0.3 + t * 3.2;
            // z varie différemment (cosinus) pour créer une autre courbe
            const z = Math.cos(t * Math.PI * 2.5) * 2.2;
            const y = surfaceY(x, z) + 0.25;
            rightPoints.push(new THREE.Vector3(x, y, z));
        }

        // Création des lignes (traits) pour chaque série
        // Gauche
        const leftLineGeometry = new THREE.BufferGeometry().setFromPoints(leftPoints);
        const leftLineMaterial = new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 }); // linewidth non supporté partout
        const leftLine = new THREE.Line(leftLineGeometry, leftLineMaterial);
        scene.add(leftLine);

        // Droite
        const rightLineGeometry = new THREE.BufferGeometry().setFromPoints(rightPoints);
        const rightLineMaterial = new THREE.LineBasicMaterial({ color: 0x00ccff });
        const rightLine = new THREE.Line(rightLineGeometry, rightLineMaterial);
        scene.add(rightLine);

        // Ajout de sphères pour les points (plus visibles)
        const sphereRadius = 0.09;
        const leftSphereMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: new THREE.Color(0x442200) });
        const rightSphereMaterial = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: new THREE.Color(0x002244) });

        // Gauche
        leftPoints.forEach(pos => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(sphereRadius, 8, 8), leftSphereMaterial);
            sphere.position.copy(pos);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            scene.add(sphere);
        });

        // Droite
        rightPoints.forEach(pos => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(sphereRadius, 8, 8), rightSphereMaterial);
            sphere.position.copy(pos);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            scene.add(sphere);
        });

        // Ajout de petits halos lumineux (points brillants) via des Points
        const leftGlowGeometry = new THREE.BufferGeometry().setFromPoints(leftPoints);
        const leftGlowMaterial = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.2, transparent: true, blending: THREE.AdditiveBlending });
        const leftGlow = new THREE.Points(leftGlowGeometry, leftGlowMaterial);
        scene.add(leftGlow);

        const rightGlowGeometry = new THREE.BufferGeometry().setFromPoints(rightPoints);
        const rightGlowMaterial = new THREE.PointsMaterial({ color: 0x00ccff, size: 0.2, transparent: true, blending: THREE.AdditiveBlending });
        const rightGlow = new THREE.Points(rightGlowGeometry, rightGlowMaterial);
        scene.add(rightGlow);

        // --- Axes et repères ---
        // Axes discrets
        const axesHelper = new THREE.AxesHelper(5);
        // scene.add(axesHelper); // décommenter pour voir les axes

        // Grille au sol pour repère
        const gridHelper = new THREE.GridHelper(10, 20, 0x6688ff, 0x335588);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        // Petites lignes verticales au niveau des extrémités ?
        // Pas nécessaire.

        // --- Animation ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() * 0.001; // seconds

            // Auto-rotation contrôlée par OrbitControls
            controls.update();

            // Faire flotter légèrement les étoiles (rotation lente)
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;

            // Petite animation sur les points ? On peut faire pulser les sphères, mais c'est facultatif.
            // Pour l'instant, on laisse statique.

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- Redimensionnement ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
